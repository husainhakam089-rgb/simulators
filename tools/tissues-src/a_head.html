<style>
  :root{
    --ash:#0b0a0c;
    --ash2:#121016;
    --smoke:#1a1620;
    --bone:#ece4d8;
    --ember:#ff7a2f;
    --ember2:#ffb14d;
    --blood:#a8221b;
    --gold:#e0ae4c;
    --gold2:#f5d089;
    --steel:#8a95a3;
    --line:rgba(224,174,76,.22);
    --glass:rgba(22,18,26,.72);
    --ok:#3fbf6f;
    --bad:#d4483c;
    --r:10px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  button,.tab,.tgl,.stool,.btn,.iconBtn,.opt,.idxBtn,label{touch-action:manipulation}
  button,.tab,.tgl,.stool,.btn,.iconBtn{user-select:none;-webkit-user-select:none}
  input[type=range]{touch-action:none}
  html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--ash);
    font-family:"Segoe UI","Tahoma","Noto Naskh Arabic",sans-serif;color:var(--bone)}
  body{display:flex;flex-direction:column;overscroll-behavior:none;
    background:
      radial-gradient(1200px 700px at 78% -12%, rgba(255,122,47,.10), transparent 60%),
      radial-gradient(900px 600px at 10% 108%, rgba(90,160,200,.09), transparent 62%),
      linear-gradient(180deg,#0e0c11,#0b0a0c 60%);
  }
  button,input,select{font-family:inherit}
  ::selection{background:rgba(255,122,47,.32)}

  /* ═══════════ زجاج ولوحات ═══════════ */
  .panel{
    background:linear-gradient(165deg,rgba(38,31,44,.88),rgba(16,13,19,.82));
    border:1px solid var(--line);
    border-radius:var(--r);
    box-shadow:0 14px 34px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(9px) saturate(120%);
  }

  /* ═══════════ الرأس ═══════════ */
  #top{flex:0 0 auto;padding:9px 16px 0;position:relative;z-index:3;
    background:linear-gradient(180deg,rgba(26,21,32,.96),rgba(13,11,15,.9));
    border-bottom:1px solid var(--line);
    box-shadow:0 8px 26px rgba(0,0,0,.45)}
  #top::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,122,47,.55),transparent)}
  #titleRow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  #titleRow h1{font-size:clamp(16px,2.2vw,24px);font-weight:700;letter-spacing:clamp(2px,.5vw,5px);
    background:linear-gradient(180deg,#fff6e6,var(--gold));-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;text-shadow:0 0 30px rgba(255,122,47,.18)}
  #titleRow .sub{color:var(--steel);letter-spacing:1.5px;font-size:11.5px}
  #titleRow .src{margin-inline-start:auto;display:flex;flex-direction:column;align-items:flex-end;
    gap:1px;padding:6px 15px;border:1px solid var(--line);border-radius:14px;
    background:linear-gradient(180deg,rgba(224,174,76,.17),rgba(224,174,76,.05));
    box-shadow:0 3px 12px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.09)}
  #titleRow .src b{font-size:14.5px;font-weight:800;color:var(--gold2);letter-spacing:.5px;
    text-shadow:0 1px 0 rgba(0,0,0,.5), 0 0 18px rgba(255,177,77,.28)}
  #titleRow .src span{font-size:10px;color:var(--steel);letter-spacing:.8px}

  #titleRow h1{cursor:pointer}
  #titleRow h1:hover{filter:brightness(1.12)}

  /* ── فهرس الجداول ── */
  .tblIdx{display:grid;gap:8px}
  .tblIdx .idxBtn{justify-content:flex-start;text-align:start;font-size:12px;
    min-height:36px;padding:10px 13px;line-height:1.5;white-space:normal}

  /* ── واجهة البداية: صورة الأستاذ كاملة وزرّها المرسوم يعمل ── */
  #welcome{position:fixed;inset:0;z-index:60;overflow:hidden;background:#0f1b2e;
    opacity:1;transition:opacity .42s ease,visibility .42s}
  #welcome.off{opacity:0;visibility:hidden;pointer-events:none}
  /* نسخة مغبّشة من الصورة نفسها تملأ باقي الشاشة */
  .welBg{position:absolute;inset:-60px;background-size:cover;background-position:center;
    filter:blur(30px) saturate(1.08);opacity:.9}
  .welStage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(100vw,75vh);width:min(100vw,calc(100dvh * 896 / 1195));aspect-ratio:896/1195;
    box-shadow:0 24px 70px rgba(18,55,36,.35);border-radius:6px;overflow:hidden}
  #welImg{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
  /* منطقة ضغط فوق زرّ «ابدأ المحاكاة» المرسوم على الصورة */
  .welHot{position:absolute;left:17.4%;top:71.3%;width:62.6%;height:13.4%;
    border:0;border-radius:999px;background:transparent;cursor:pointer;padding:0;
    touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    animation:welPulse 2.6s ease-in-out infinite;transition:transform .14s ease,background .18s}
  @keyframes welPulse{0%,100%{box-shadow:0 0 0 0 rgba(90,170,110,0)}
    50%{box-shadow:0 0 26px 6px rgba(90,170,110,.42)}}
  .welHot:hover{background:rgba(255,255,255,.10);box-shadow:0 0 30px 8px rgba(90,170,110,.5)}
  .welHot:active{transform:scale(.96);background:rgba(20,70,40,.10)}
  .welHot:focus-visible{outline:3px solid #2f6b4a;outline-offset:3px}
  .welExam{position:fixed;top:calc(14px + env(safe-area-inset-top));left:14px;z-index:2;
    padding:10px 18px!important;font-size:13px!important}
  .btn3d{font-family:inherit;cursor:pointer;font-weight:800;letter-spacing:.4px;
    font-size:clamp(13.5px,1.7vw,16px);touch-action:manipulation;user-select:none;
    color:#fff;padding:14px 32px;border-radius:14px;border:1px solid rgba(255,255,255,.42);
    background:linear-gradient(180deg,#5aa87a 0%,#2f6b4a 55%,#255a3d 100%);
    box-shadow:0 6px 0 #1b4630, 0 14px 26px rgba(20,60,40,.32),
               inset 0 1px 0 rgba(255,255,255,.5), inset 0 -7px 13px rgba(0,0,0,.14);
    transition:transform .12s ease, box-shadow .12s ease, filter .18s}
  .btn3d:hover{filter:brightness(1.07)}
  .btn3d:active{transform:translateY(5px);
    box-shadow:0 1px 0 #1b4630, 0 6px 12px rgba(20,60,40,.3), inset 0 1px 0 rgba(255,255,255,.4)}
  .btn3d:focus-visible{outline:none;
    box-shadow:0 0 0 3px #fff, 0 0 0 6px #2f6b4a, 0 6px 0 #1b4630}
  .btn3d.ghost3d{color:#1e4a33;border-color:rgba(18,63,40,.18);
    background:linear-gradient(180deg,#ffffff 0%,#e7efe6 100%);
    box-shadow:0 6px 0 #bcccbe, 0 12px 22px rgba(20,60,40,.18), inset 0 1px 0 #fff}
  .btn3d.ghost3d:active{box-shadow:0 1px 0 #bcccbe, 0 6px 12px rgba(20,60,40,.18), inset 0 1px 0 #fff}

  /* ── شريط التبويبات ── */
  #tabsWrap{position:relative;margin-top:9px}
  #tabsWrap::before,#tabsWrap::after{content:'';position:absolute;top:0;bottom:6px;width:26px;pointer-events:none;z-index:2}
  #tabsWrap::before{right:0;background:linear-gradient(270deg,rgba(18,15,22,.95),transparent)}
  #tabsWrap::after{left:0;background:linear-gradient(90deg,rgba(18,15,22,.95),transparent)}
  #tabs{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:0 4px 7px;
    scrollbar-width:none}
  #tabs::-webkit-scrollbar{display:none}
  .tab{position:relative;cursor:pointer;white-space:nowrap;font-size:12.5px;font-weight:600;letter-spacing:.3px;
    padding:10px 16px;border-radius:999px;color:var(--steel);min-height:36px;
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 2px 6px rgba(0,0,0,.3), 0 1px 0 rgba(255,255,255,.05) inset;
    transition:color .2s,border-color .2s,background .2s,transform .16s,box-shadow .22s}
  .tab:hover{color:var(--bone);border-color:rgba(224,174,76,.45);transform:translateY(-2px);
    box-shadow:0 7px 16px rgba(0,0,0,.4)}
  .tab.on{color:#221607;font-weight:700;border-color:rgba(255,255,255,.38);
    background:linear-gradient(180deg,#ffe2a6,var(--gold) 55%,#c2902f);
    box-shadow:0 7px 20px rgba(224,174,76,.36), inset 0 1px 0 rgba(255,255,255,.62),
               inset 0 -6px 12px rgba(120,80,10,.25)}
  .tab:focus-visible{outline:none;box-shadow:0 0 0 2px #0e0c11,0 0 0 4px var(--gold2)}

  /* ═══════════ الجسم ═══════════ */
  #wrap{flex:1 1 auto;display:flex;flex-direction:row-reverse;min-height:0}

  #stage{position:relative;flex:1 1 auto;min-width:0;min-height:0;overflow:hidden;
    background:
      radial-gradient(1000px 620px at 50% 42%, var(--tint1,rgba(70,120,104,.30)), transparent 68%),
      radial-gradient(700px 500px at 82% 88%, var(--tint2,rgba(60,90,130,.18)), transparent 70%),
      linear-gradient(180deg,#121017,#0a090c)}
  /* هالات ضوئية ناعمة بالخلفية */
  #stage::before{content:'';position:absolute;inset:-12%;pointer-events:none;
    background:
      radial-gradient(240px 240px at 18% 26%, rgba(255,180,90,.09), transparent 65%),
      radial-gradient(300px 300px at 84% 30%, rgba(120,200,255,.06), transparent 68%),
      radial-gradient(260px 260px at 62% 84%, rgba(160,255,190,.055), transparent 68%);
    animation:drift 26s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-2.5%,2%,0) scale(1.06)}}
  /* حواف داكنة */
  #stage::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 100% at 50% 45%, transparent 52%, rgba(6,5,8,.72) 100%)}
  #svgHost{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;z-index:1}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

  #sceneHead{position:absolute;top:10px;right:14px;left:14px;pointer-events:none;z-index:2;
    display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
  #sceneName{font-size:13px;letter-spacing:1px;color:var(--gold2);font-weight:600;
    background:rgba(12,10,15,.6);border:1px solid var(--line);border-radius:999px;padding:5px 13px;
    backdrop-filter:blur(6px)}
  #sceneName b{color:var(--steel);font-weight:400;font-size:11px;margin-inline-start:6px}
  #sceneHint{font-size:11.5px;color:#b9b2a6;line-height:1.75;max-width:58%;text-align:left;
    background:rgba(12,10,15,.5);border:1px solid rgba(255,255,255,.06);border-radius:10px;
    padding:7px 11px;backdrop-filter:blur(6px)}

  /* ═══════════ نظام الأزرار ═══════════ */
  .ic{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;
    stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .ic.fill{fill:currentColor;stroke:none}

  .btn,.stool{
    position:relative;overflow:hidden;isolation:isolate;
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    cursor:pointer;font-size:12.5px;font-weight:600;letter-spacing:.2px;line-height:1;
    color:#d9d2c6;min-height:38px;padding:10px 15px;border-radius:11px;
    background:linear-gradient(180deg,#39303f 0%,#241d2b 55%,#1b1622 100%);
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 4px 12px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.05) inset,
               0 -8px 14px rgba(0,0,0,.22) inset;
    transition:transform .14s cubic-bezier(.3,1.4,.5,1),border-color .18s,box-shadow .2s,color .18s,background .22s}
  /* خط ضوء علوي رفيع */
  .btn::after,.stool::after{content:'';position:absolute;inset-inline:12%;top:0;height:1px;z-index:2;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);opacity:.7}
  /* لمعة تمر عند المرور */
  .btn::before,.stool::before{content:'';position:absolute;inset:-1px;z-index:1;border-radius:inherit;
    background:linear-gradient(115deg,transparent 34%,rgba(255,255,255,.16) 48%,transparent 62%);
    transform:translateX(130%);transition:transform .62s ease}
  .btn > *,.stool > *{position:relative;z-index:3}
  .btn:hover,.stool:hover{transform:translateY(-2px);color:#fff;
    border-color:rgba(224,174,76,.55);
    box-shadow:0 10px 24px rgba(0,0,0,.55), 0 0 0 1px rgba(224,174,76,.14),
               0 1px 0 rgba(255,255,255,.1) inset}
  .btn:hover::before,.stool:hover::before{transform:translateX(-130%)}
  .btn:active,.stool:active{transform:translateY(0) scale(.985);
    box-shadow:0 2px 8px rgba(0,0,0,.5), 0 3px 10px rgba(0,0,0,.4) inset}
  .btn:focus-visible,.stool:focus-visible{outline:none;
    box-shadow:0 0 0 2px var(--ash), 0 0 0 4px var(--gold2), 0 8px 20px rgba(0,0,0,.5)}
  .btn .ic,.stool .ic{opacity:.85}
  .btn:hover .ic,.stool:hover .ic{opacity:1}

  /* مفعّل */
  .stool.on{color:#221607;
    background:linear-gradient(180deg,#ffe2a6 0%,var(--gold) 52%,#bd8b2c 100%);
    border-color:rgba(255,255,255,.4);
    box-shadow:0 6px 18px rgba(224,174,76,.4), 0 1px 0 rgba(255,255,255,.65) inset,
               0 -6px 12px rgba(120,80,10,.28) inset}
  .stool.on .ic{opacity:1}
  .stool.on::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent)}

  /* أساسي */
  .btn.primary{color:#2a1503;
    background:linear-gradient(180deg,#ffc978 0%,var(--ember) 55%,#cf5615 100%);
    border-color:rgba(255,255,255,.34);
    box-shadow:0 8px 22px rgba(255,122,47,.36), 0 1px 0 rgba(255,255,255,.55) inset,
               0 -7px 14px rgba(150,50,0,.3) inset}
  .btn.primary:hover{box-shadow:0 12px 30px rgba(255,122,47,.48), 0 1px 0 rgba(255,255,255,.6) inset}
  .btn.ghost{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
    color:var(--steel);box-shadow:0 2px 8px rgba(0,0,0,.3), 0 1px 0 rgba(255,255,255,.04) inset}
  .btn.ghost:hover{color:var(--bone)}

  /* زر أيقونة دائري */
  .iconBtn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
    width:30px;height:30px;border-radius:9px;color:var(--steel);
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.12);transition:.18s}
  .iconBtn:hover{color:#fff;border-color:var(--gold);background:rgba(224,174,76,.16);transform:translateY(-1px)}
  .iconBtn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--ash),0 0 0 4px var(--gold2)}
  .iconBtn .ic{width:14px;height:14px}

  /* ═══ مجموعة اختيار (segmented) ═══ */
  .segbar{display:inline-flex;flex-wrap:wrap;gap:3px;padding:4px;border-radius:14px;max-width:100%;
    background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.24));
    border:1px solid rgba(255,255,255,.07);
    box-shadow:inset 0 3px 9px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.04)}
  .segbar .stool,.segb{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;
    cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.2px;
    min-height:34px;padding:8px 13px;border-radius:10px;color:var(--steel);
    background:transparent;border:1px solid transparent;box-shadow:none;transition:.18s}
  .segbar .stool::after,.segb::after{display:none}
  .segbar .stool::before,.segb::before{display:none}
  .segbar .stool:hover,.segb:hover{background:rgba(255,255,255,.07);color:var(--bone);
    transform:none;box-shadow:none;border-color:transparent}
  .segbar .stool.on,.segb.on{color:#221607;
    background:linear-gradient(180deg,#ffe2a6,var(--gold) 58%,#c2902f);
    border-color:rgba(255,255,255,.35);
    box-shadow:0 5px 14px rgba(224,174,76,.35), 0 1px 0 rgba(255,255,255,.6) inset}
  .segbar .stool:focus-visible,.segb:focus-visible{outline:none;
    box-shadow:0 0 0 2px rgba(0,0,0,.6),0 0 0 4px var(--gold2)}

  /* ═══ شريط أدوات المشهد ═══ */
  #sceneTools{position:absolute;bottom:12px;right:12px;left:12px;z-index:2;
    display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;align-items:center}
  #sceneTools .grp{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:7px;border-radius:16px;
    background:linear-gradient(180deg,rgba(26,21,32,.82),rgba(12,10,16,.78));
    border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(10px) saturate(130%);
    box-shadow:0 14px 34px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.05) inset}

  .sliderWrap{display:inline-flex;align-items:center;gap:10px;min-height:38px;padding:8px 14px;border-radius:11px;
    background:linear-gradient(180deg,#39303f,#1b1622);border:1px solid rgba(255,255,255,.1);
    box-shadow:0 4px 12px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.05) inset}
  .sliderWrap span{font-size:11.5px;font-weight:600;color:var(--gold2);letter-spacing:.3px}
  .sliderWrap input[type=range]{width:min(280px,46vw)}

  /* شريط الأطوار */
  #phaseBar{position:absolute;top:52px;left:14px;width:min(262px,46vw);padding:11px 13px;display:none;z-index:2}
  #phaseBar.on{display:block}
  #phaseBar .pname{color:var(--gold2);font-size:13px;letter-spacing:.6px;margin-bottom:6px;font-weight:700}
  #phaseBar .pdesc{font-size:11.5px;color:#cfc8bd;line-height:1.8}
  #phaseBar .pchrom{margin-top:8px;font-size:11px;color:var(--steel);letter-spacing:.4px}
  #phaseBar .pchrom b{color:var(--ember2)}
  #phaseBar .pcap{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);
    font-size:11px;color:var(--gold);line-height:1.7}
  #phaseBar .psrc{margin-top:7px;font-size:10px;color:var(--steel);opacity:.8}

  /* ═══════════ لوحة المعلومات ═══════════ */
  #info{width:min(348px,35vw);flex:0 0 auto;display:flex;flex-direction:column;position:relative;z-index:2;
    background:linear-gradient(255deg,rgba(17,14,20,.99) 0%,rgba(13,11,16,.97) 78%,rgba(11,9,13,.95) 100%);
    border-inline-end:1px solid var(--line);text-align:right;
    box-shadow:-18px 0 40px rgba(0,0,0,.35)}
  #infoHead{flex:0 0 auto;padding:13px 16px 11px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:9px;
    background:linear-gradient(180deg,rgba(255,122,47,.07),transparent)}
  #infoName{font-size:15.5px;color:var(--gold2);letter-spacing:.4px;font-weight:700;line-height:1.5}
  #infoSrc{font-size:10px;color:var(--steel);margin-top:3px;letter-spacing:.3px}
  #infoClose{margin-inline-start:auto;display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.12);border-radius:9px;
    color:var(--steel);width:30px;height:30px;flex:0 0 auto;transition:.18s}
  #infoClose:hover{color:#fff;border-color:var(--gold);background:rgba(224,174,76,.16);transform:translateY(-1px)}
  #infoClose .ic{width:14px;height:14px}
  #infoBody{flex:1 1 auto;overflow-y:auto;padding:13px 16px 18px;
    scrollbar-width:thin;scrollbar-color:rgba(224,174,76,.4) transparent}
  #infoBody::-webkit-scrollbar{width:7px}
  #infoBody::-webkit-scrollbar-thumb{background:rgba(224,174,76,.3);border-radius:4px}
  .fld{margin-bottom:12px;padding:10px 12px;border-radius:10px;
    background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
    border:1px solid rgba(255,255,255,.06);border-inline-start:3px solid rgba(224,174,76,.5)}
  .fld h5{font-size:10px;letter-spacing:2px;color:var(--gold);font-weight:700;margin-bottom:6px}
  .fld p{font-size:12.5px;line-height:1.95;color:#ddd5c9}
  .fld.note{border-inline-start-color:var(--ember);background:linear-gradient(180deg,rgba(255,122,47,.09),rgba(255,122,47,.02))}
  .fld.note p{color:#ffd9b0}
  #infoFoot{flex:0 0 auto;padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
  #seeFn{flex:1;font-size:12.5px;letter-spacing:1px;padding:12px 10px}
  #seeFn:disabled{background:rgba(255,255,255,.05);color:var(--steel);cursor:default;
    box-shadow:none;transform:none;border-color:rgba(255,255,255,.07)}
  #infoEmpty{padding:18px 16px;font-size:12.5px;line-height:2;color:var(--steel)}
  #infoEmpty b{color:var(--gold2)}
  #infoEmpty .hintCard{margin-top:12px;padding:11px 13px;border-radius:10px;
    background:rgba(255,255,255,.035);border:1px dashed rgba(224,174,76,.3);font-size:11.5px;color:#c4bcb0}

  /* ═══════════ شريط التحكم ═══════════ */
  #bar{flex:0 0 auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    padding:9px 16px calc(9px + env(safe-area-inset-bottom)) 16px;
    border-top:1px solid var(--line);position:relative;z-index:3;
    background:linear-gradient(0deg,rgba(24,20,30,.97),rgba(13,11,16,.92));
    box-shadow:0 -10px 26px rgba(0,0,0,.4);font-size:12px}
  #bar .ctl{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:10px;
    background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
  #bar label{color:var(--steel);letter-spacing:.3px;white-space:nowrap}
  #bar output{color:var(--gold2);font-variant-numeric:tabular-nums;min-width:32px;text-align:left;font-size:11.5px}
  #playBtn{min-width:104px;text-align:center}

  /* منزلق مخصص */
  input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:22px;cursor:pointer;--p:50%}
  input[type=range]::-webkit-slider-runnable-track{height:7px;border-radius:99px;
    background:linear-gradient(90deg,#ff9a4d 0%,var(--ember) var(--p),rgba(255,255,255,.12) var(--p));
    box-shadow:inset 0 2px 4px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.06)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    margin-top:-5.5px;background:radial-gradient(circle at 34% 28%,#fff8e8,var(--gold2) 45%,#c9963a);
    border:1px solid rgba(0,0,0,.5);
    box-shadow:0 3px 10px rgba(0,0,0,.65), 0 0 0 3px rgba(224,174,76,.16);transition:box-shadow .18s,transform .12s}
  input[type=range]:hover::-webkit-slider-thumb{box-shadow:0 4px 14px rgba(0,0,0,.7), 0 0 0 5px rgba(224,174,76,.24)}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.08)}
  input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:rgba(255,255,255,.16)}
  input[type=range]::-moz-range-progress{height:6px;border-radius:99px;background:rgba(255,122,47,.75)}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;border:1px solid rgba(0,0,0,.4);
    background:radial-gradient(circle at 35% 30%,#fff2d8,var(--gold))}
  input[type=range]:focus-visible{outline:2px solid var(--gold2);outline-offset:4px}
  #spd{width:110px}

  /* مفتاح تبديل */
  .tgl{cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--steel);font-weight:600;
    min-height:38px;padding:6px 12px 6px 10px;border-radius:11px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.09);transition:.18s;white-space:nowrap;
    box-shadow:0 2px 8px rgba(0,0,0,.3), 0 1px 0 rgba(255,255,255,.04) inset}
  .tgl:hover{color:var(--bone);border-color:rgba(224,174,76,.4);transform:translateY(-1px)}
  .tgl:has(input:checked){color:var(--bone);border-color:rgba(255,122,47,.38);
    background:linear-gradient(180deg,rgba(255,122,47,.13),rgba(255,122,47,.04))}
  .tgl .ic{width:14px;height:14px;opacity:.8}
  .tgl input{appearance:none;-webkit-appearance:none;width:38px;height:21px;border-radius:99px;cursor:pointer;
    background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(255,255,255,.08));
    border:1px solid rgba(255,255,255,.14);position:relative;transition:.22s;flex:0 0 auto;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
  .tgl input::after{content:'';position:absolute;top:2px;right:2px;width:15px;height:15px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#c6bdb1);transition:.22s cubic-bezier(.3,1.5,.5,1);
    box-shadow:0 2px 5px rgba(0,0,0,.55)}
  .tgl input:checked{background:linear-gradient(90deg,#b8551f,var(--ember));border-color:rgba(255,122,47,.55);
    box-shadow:inset 0 1px 4px rgba(0,0,0,.35), 0 0 12px rgba(255,122,47,.32)}
  .tgl input:checked::after{right:calc(100% - 17px);background:radial-gradient(circle at 35% 30%,#fff,#ffe2c4)}
  .tgl input:focus-visible{outline:none;box-shadow:0 0 0 2px var(--ash),0 0 0 4px var(--gold2)}
  #barSpacer{margin-inline-start:auto}

  /* ═══════════ الرسم: حالات التفاعل ═══════════ */
  #fxLayer,#molLayer,#diffLayer,#osmoLayer,#apLayer,#atpLayer,#sugarLayer,#membMol,#solArrows{pointer-events:none}
  .part{cursor:pointer;transition:opacity .28s,transform .3s}
  .part.sel{transform-box:fill-box;transform-origin:center;transform:scale(1.06)}
  .part.sel[data-part=cyto],.part.sel[data-part=pm],.part.sel[data-part=wall],
  .part.sel[data-part=lipidBundle],.part.sel[data-part=nucleoplasm],.part.sel[data-part=env],
  .part.sel[data-part=chromatin],.part.sel[data-part=stroma],.part.sel[data-part=matrix],
  .part.sel[data-part=bpm],.part.sel[data-part=capsule],
  .part.sel[data-part=vascCamb],.part.sel[data-part=corkCamb],.part.sel[data-part=secPhl],.part.sel[data-part=secXyl],.part.sel[data-part=periEpi]{transform:none}
  #svgHost.dim .part:not(.sel){opacity:.2}
  #svgHost.dim .part:not(.sel):has(.part.sel){opacity:1}
  /* أسماء الأجزاء تنضغط مثل الجزء نفسه */
  .lblHit{fill:transparent;stroke:none;pointer-events:all;cursor:pointer}
  #labelLayer .lblG .lbl,#labelLayer .lblG .lead{transition:fill .18s,stroke .18s,opacity .25s}
  #labelLayer .lblG{transition:opacity .25s}
  #labelLayer .lblG.clk:hover .lbl{fill:var(--gold2)}
  #labelLayer .lblG.clk:hover .lead{stroke:var(--gold2);opacity:1}
  #labelLayer .lblG.sel .lbl{fill:var(--gold2);font-weight:700}
  #labelLayer .lblG.sel .lead{stroke:var(--gold2);stroke-width:1.9;opacity:1}
  #labelLayer .lblG.sel .lblDot{fill:#fff3cf;filter:drop-shadow(0 0 4px #ffd166) drop-shadow(0 0 2px #ffd166)}
  #svgHost.dim #labelLayer .lblG:not(.sel){opacity:.32}
  /* معاينة: المرور على الاسم يضيء جزءه */
  .part.hov{filter:brightness(1.28) drop-shadow(0 0 7px rgba(255,209,102,.75))}
  #svgHost.flat *{filter:none!important}
  .lbl{pointer-events:none;font-size:13px;fill:var(--bone);direction:rtl;
    paint-order:stroke;stroke:rgba(8,7,10,.85);stroke-width:3.2px;stroke-linejoin:round}
  .lbl.sm{font-size:11.5px}
  .lead{pointer-events:none;stroke:rgba(236,228,216,.5);stroke-width:1.1;fill:none}
  .lblDot{pointer-events:none;fill:var(--gold2)}
  #labelLayer.off{display:none}
  .cap{pointer-events:none;font-size:14px;fill:var(--gold2);direction:rtl;
    paint-order:stroke;stroke:rgba(8,7,10,.8);stroke-width:3px;stroke-linejoin:round}
  .cap.sm{font-size:12px}

  /* ═══════════ الجداول ═══════════ */
  #sheet{position:absolute;inset:auto 14px 62px 14px;max-height:68%;display:none;
    flex-direction:column;overflow:hidden;z-index:4}
  #sheet.on{display:flex}
  #sheetHead{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:11px 14px;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,122,47,.1),transparent)}
  #sheetHead h4{font-size:12.5px;color:var(--gold2);letter-spacing:.4px;font-weight:700}
  #sheetClose{margin-inline-start:auto;display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
    border-radius:9px;color:var(--steel);width:28px;height:28px;transition:.18s}
  #sheetClose:hover{color:#fff;border-color:var(--gold);background:rgba(224,174,76,.16)}
  #sheetClose .ic{width:13px;height:13px}
  #sheetBody{flex:1 1 auto;overflow:auto;padding:0 0 6px;
    scrollbar-width:thin;scrollbar-color:rgba(224,174,76,.4) transparent}
  #sheetBody::-webkit-scrollbar{width:7px;height:7px}
  #sheetBody::-webkit-scrollbar-thumb{background:rgba(224,174,76,.3);border-radius:4px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:9px 12px;text-align:right;border-bottom:1px solid rgba(255,255,255,.07);line-height:1.75;
    vertical-align:top}
  th{color:var(--gold2);font-weight:700;font-size:11.5px;letter-spacing:.3px;
    background:linear-gradient(180deg,rgba(255,122,47,.16),rgba(255,122,47,.06));position:sticky;top:0;
    backdrop-filter:blur(6px)}
  tbody tr:nth-child(odd){background:rgba(255,255,255,.022)}
  tbody tr:hover{background:rgba(224,174,76,.07)}

  /* ═══════════ وضع الامتحان ═══════════ */
  #exam{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;z-index:5;
    background:
      radial-gradient(900px 560px at 50% 36%, rgba(70,120,104,.22), transparent 66%),
      linear-gradient(180deg,#121017,#0a090c)}
  #exam.on{display:flex}
  #examTop{flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:10px 14px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(26,21,32,.9),transparent)}
  .seg{display:flex;gap:4px;padding:4px;border-radius:12px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
  .seg button{cursor:pointer;font-size:12px;letter-spacing:.3px;padding:8px 14px;border-radius:9px;
    color:var(--steel);background:transparent;border:0;transition:.18s}
  .seg button:hover{color:var(--bone)}
  .seg button.on{color:#1a1208;font-weight:700;
    background:linear-gradient(180deg,var(--gold2),var(--gold));
    box-shadow:0 4px 12px rgba(224,174,76,.3)}
  #score{margin-inline-start:auto;font-size:12px;color:var(--steel);letter-spacing:.3px;
    padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
  #score b{color:var(--ember2);font-variant-numeric:tabular-nums;font-size:15px}
  #examBody{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column}

  #dragWrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  #pickRow{flex:0 0 auto;display:flex;gap:6px;flex-wrap:wrap;padding:9px 14px;
    border-bottom:1px solid rgba(255,255,255,.06);align-items:center}
  #pickRow span{font-size:11px;color:var(--steel);letter-spacing:.3px}
  #pickRow .stool{font-size:11.5px;padding:7px 12px}
  #dragStage{flex:1 1 auto;min-height:0;position:relative}
  #dragSvgHost{position:absolute;inset:0;width:100%;height:100%}
  #tray{flex:0 0 auto;display:flex;gap:7px;flex-wrap:wrap;padding:11px 14px;max-height:34%;overflow-y:auto;
    border-top:1px solid var(--line);background:linear-gradient(0deg,rgba(18,15,22,.9),rgba(18,15,22,.6))}
  .chip{cursor:grab;touch-action:none;font-size:12px;color:var(--bone);
    padding:9px 13px;border-radius:9px;
    background:linear-gradient(180deg,rgba(62,51,70,.95),rgba(26,21,30,.95));
    border:1px solid rgba(255,255,255,.12);white-space:nowrap;user-select:none;
    box-shadow:0 4px 12px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.1);transition:.15s}
  .chip:hover{transform:translateY(-1.5px);border-color:rgba(224,174,76,.5)}
  .chip.drag{position:fixed;z-index:60;cursor:grabbing;border-color:var(--ember);
    box-shadow:0 14px 34px rgba(0,0,0,.6);pointer-events:none;transform:scale(1.04)}
  .chip.done{cursor:default;color:#9fe9b9;border-color:rgba(63,191,111,.55);
    background:linear-gradient(180deg,rgba(63,191,111,.22),rgba(63,191,111,.08));box-shadow:none;transform:none}
  .chip.wrong{animation:shake .32s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .slot{fill:rgba(236,228,216,.05);stroke:rgba(224,174,76,.55);stroke-width:1.4;stroke-dasharray:5 3;rx:8}
  .slot.hot{fill:rgba(255,122,47,.2);stroke:var(--ember);stroke-dasharray:none;stroke-width:2}
  .slot.done{fill:rgba(63,191,111,.16);stroke:var(--ok);stroke-dasharray:none}
  .slotTxt{pointer-events:none;font-size:10.5px;fill:#9fe9b9;direction:rtl}
  #dragDone{padding:11px 14px;font-size:12.5px;color:var(--gold2);line-height:1.8;display:none;
    background:linear-gradient(180deg,rgba(63,191,111,.14),transparent);border-top:1px solid rgba(63,191,111,.3)}
  #dragDone.on{display:block}

  #quiz{flex:1 1 auto;overflow-y:auto;padding:16px 16px 24px;display:none}
  #quiz.on{display:block}
  #qMeta{font-size:11px;color:var(--steel);letter-spacing:1px;margin-bottom:9px}
  #qText{font-size:15px;line-height:1.95;color:var(--bone);margin-bottom:15px;max-width:820px;font-weight:600}
  #qOpts{display:flex;flex-direction:column;gap:9px;max-width:820px}
  .opt{cursor:pointer;text-align:right;font-size:13.5px;line-height:1.75;color:var(--bone);
    display:flex;align-items:center;gap:12px;
    padding:13px 14px;border-radius:12px;
    background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
    border:1px solid rgba(255,255,255,.09);transition:.18s;
    box-shadow:0 3px 10px rgba(0,0,0,.28), 0 1px 0 rgba(255,255,255,.04) inset}
  .optKey{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
    width:28px;height:28px;border-radius:9px;font-size:13px;font-weight:700;color:var(--gold2);
    background:linear-gradient(180deg,rgba(224,174,76,.18),rgba(224,174,76,.06));
    border:1px solid rgba(224,174,76,.32)}
  .opt:hover:not(:disabled){border-color:var(--gold);transform:translateX(-4px);
    box-shadow:0 8px 20px rgba(0,0,0,.4)}
  .opt.good .optKey{color:#c8f2d8;background:rgba(63,191,111,.22);border-color:rgba(63,191,111,.5)}
  .opt.bad .optKey{color:#f6c9c4;background:rgba(212,72,60,.2);border-color:rgba(212,72,60,.5)}
  .opt:disabled{cursor:default}
  .opt.good{border-color:var(--ok);background:linear-gradient(180deg,rgba(63,191,111,.2),rgba(63,191,111,.06));color:#c8f2d8}
  .opt.bad{border-color:var(--bad);background:linear-gradient(180deg,rgba(212,72,60,.18),rgba(212,72,60,.05));color:#f6c9c4}
  #qWhy{margin-top:15px;padding:13px 15px;font-size:12.5px;line-height:1.95;display:none;max-width:820px}
  #qWhy.on{display:block}
  #qWhy b{color:var(--gold2)}
  #qNext{margin-top:15px;display:none;font-size:12.5px;letter-spacing:1px;padding:12px 26px}
  #qNext.on{display:inline-block}

  /* ═══════════ موبايل ═══════════ */
  @media (max-width:880px),(orientation:portrait){
    #wrap{flex-direction:column}
    #stage{flex:1 1 auto}
    /* ارتفاع ثابت: الرسم ما يتحرك تحت إصبعك حين تمتلئ اللوحة بعد الضغط */
    #info{width:100%;flex:0 0 44%;max-height:44%;border-inline-end:0;
      border-top:1px solid var(--line);box-shadow:0 -16px 34px rgba(0,0,0,.45);
      background:linear-gradient(0deg,rgba(17,14,20,.99),rgba(13,11,16,.97))}
    #sheet{inset:auto 8px 8px 8px;max-height:74%}
    #sceneHint{display:none}
    #phaseBar{width:min(215px,58vw);left:8px;top:46px;padding:9px 11px}
    #bar{gap:7px;padding:8px 10px;font-size:11.5px}
    #bar .ctl{padding:4px 8px}
    #spd{width:76px}
    #titleRow .sub{display:none}
    #titleRow .src{padding:4px 9px;border-radius:11px}
    #titleRow .src b{font-size:11.5px}
    #titleRow .src span{font-size:8.5px}
    th,td{padding:8px 9px;font-size:11.5px}
    .lbl{font-size:28px;stroke-width:5px}
    .lbl.sm{font-size:23px}
    .lead{stroke-width:1.8}
    .lblDot{r:5}
    .cap{font-size:22px;stroke-width:4px}
    .cap.sm{font-size:18px}
    .slotTxt{font-size:15px}
    /* أشرطة الأدوات: صف واحد قابل للسحب أفقياً بدل الالتفاف */
    #sceneTools{bottom:8px;right:8px;left:8px;flex-wrap:nowrap;overflow-x:auto;
      scrollbar-width:none;padding-bottom:2px}
    #sceneTools::-webkit-scrollbar{display:none}
    #sceneTools .grp{flex-wrap:nowrap;flex:0 0 auto}
    .segbar{flex-wrap:nowrap;flex:0 0 auto}
    .segbar .stool,.segb,.stool,.btn,.tgl,.sliderWrap{flex:0 0 auto}
    #bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
    #bar::-webkit-scrollbar{display:none}
    #barSpacer{display:none}
    .btn,.stool{min-height:40px;font-size:12.5px;padding:10px 14px}
    .segbar .stool,.segb{min-height:36px}
    .tgl{min-height:40px}
  }
  @media (max-width:430px){
    #titleRow h1{font-size:15px;letter-spacing:1px}
    #bar .ctl > label{display:none}
    #tblBtn span,#themeBtn span,#fsBtn span,#v3Btn span{display:none}
    #lbl3d .lbl{font-size:10.5px;stroke-width:2.6px}
    .tgl > span{display:none}
    .tgl{padding:6px 10px;gap:7px}
    #spd{width:62px}
    .tab{padding:8px 12px;font-size:12px}
    #playBtn{min-width:86px;padding:9px 10px}
  }
  /* موبايل بالعرض: الرسم كبير أصلاً فلا نكبّر الأسماء حتى لا تتراكب */
  @media (orientation:landscape) and (max-height:520px){
    .lbl{font-size:19px;stroke-width:4px}
    .lbl.sm{font-size:16px}
    .cap{font-size:18px;stroke-width:3.6px}
    .cap.sm{font-size:15px}
    .lead{stroke-width:1.4}
    .lblDot{r:4.2}
    .slotTxt{font-size:13px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important}
    #stage::before{animation:none}
  }

  /* ═══════════ العرض ثلاثي الأبعاد ═══════════ */
  #gl3d,#lbl3d{position:absolute;inset:0;width:100%;height:100%;display:none}
  #gl3d{z-index:1;touch-action:none;cursor:grab}
  #gl3d:active{cursor:grabbing}
  #lbl3d{z-index:2;pointer-events:none;overflow:visible}
  body.v3 #gl3d,body.v3 #lbl3d{display:block}
  body.v3 #svgHost,body.v3 #fx{display:none!important}
  body.v3 #lbl3d.off{display:none}
  #lbl3d .lbl{font-size:12.5px;stroke-width:3px}
  #lbl3d .lblG .lbl,#lbl3d .lblG .lead{transition:fill .18s,stroke .18s}
  #lbl3d .lblG{transition:opacity .25s}
  #lbl3d .lblG.clk:hover .lbl,#lbl3d .lblG.hov .lbl{fill:var(--gold2)}
  #lbl3d .lblG.clk:hover .lead,#lbl3d .lblG.hov .lead{stroke:var(--gold2);opacity:1}
  #lbl3d .lblG.sel .lbl{fill:var(--gold2);font-weight:700}
  #lbl3d .lblG.sel .lead{stroke:var(--gold2);stroke-width:1.9;opacity:1}
  #lbl3d .lblG.sel .lblDot{fill:#fff3cf;filter:drop-shadow(0 0 4px #ffd166)}
  #lbl3d.dim .lblG:not(.sel){opacity:.32}
  #lbl3d .lblG.back:not(.sel) .lead,#lbl3d .lblG.back:not(.sel) .lblDot{opacity:.35}
  #v3Btn.on{color:#221607;background:linear-gradient(180deg,#ffe2a6 0%,var(--gold) 52%,#bd8b2c 100%);border-color:rgba(255,255,255,.4)}
  #v3Btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
  @media (max-width:700px){ #lbl3d .lbl{font-size:10.5px;stroke-width:2.6px} }
  /* نقطة التأشير فوق المجسم لا تحجز اللمس: السحب منها يدوّر المجسم، والنقر عليها يلتقط الجزء نفسه من المجسم */
  #lbl3d .dotHit{pointer-events:none}
  #lbl3d.hidelab .lblG{display:none}
  /* الموبايل بالمجسّم: لوحة الطور مختصرة (الاسم والعدد) ويُفتح وصفها بالضغط عليها حتى لا تغطي المجسّم */
  @media (max-width:700px){
    body.v3 #phaseBar{cursor:pointer}
    body.v3 #phaseBar:not(.open) .pdesc,body.v3 #phaseBar:not(.open) .psrc{display:none}
    body.v3 #phaseBar:not(.open) .pname::after{content:' ▾';font-size:10px;opacity:.7}
  }
  #lbl3d .cap3d{fill:var(--bone);paint-order:stroke;stroke:rgba(10,12,18,.75);stroke-width:3px;pointer-events:none}
  #lbl3d .cap3d .c1{font-size:14px;font-weight:700;fill:var(--gold2)}
  #lbl3d .cap3d .c2{font-size:11.5px;opacity:.9}
  #lbl3d.compact .cap3d .c1{font-size:11px}
  #lbl3d.compact .cap3d .c2{font-size:9.5px}
  html[data-theme=day] #lbl3d .cap3d{stroke:rgba(255,255,255,.85)}
  html[data-theme=day] #lbl3d .cap3d .c1{fill:#8a5a10}
  #lbl3d.tiny .lblG{display:none}
  #lbl3d.compact .lbl{font-size:9.6px;stroke-width:2.4px}
  #lbl3d.compact .lblDot{r:2.8px}
  html[data-theme=day] #v3Btn.on{color:#221607;background:linear-gradient(180deg,#ffe2a6,#e0ae4c 55%,#c2902f)}

  /* ═══════════ الامتحان: الشريط يبقى بدون أدوات الحركة ═══════════ */
  body.examMode #playBtn,body.examMode #bar .ctl,body.examMode #bar .tgl,body.examMode #resetBtn,body.examMode #v3Btn{display:none}
  /* ═══════════ وضع الرسم اليدوي ═══════════ */
  .welDraw{top:calc(68px + env(safe-area-inset-top))!important}
  #drawM{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;z-index:5;
    background:radial-gradient(900px 560px at 50% 36%, rgba(120,100,70,.2), transparent 66%),linear-gradient(180deg,#121017,#0a090c)}
  #drawM.on{display:flex}
  #drPick{flex:0 0 auto;display:flex;gap:6px;padding:9px 14px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  #drPick{flex-direction:column;gap:7px}
  #drCats,#drItems{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
  #drCats{align-self:flex-start;max-width:100%}
  #drPick .stool{font-size:11.5px;padding:7px 12px;white-space:nowrap;flex:0 0 auto}
  #drSvg .drT{fill:#2d2a26}
  #drSvg .drT.drNow{fill:#a8432b}
  #drBody{flex:1 1 auto;min-height:0;display:flex;gap:10px;padding:10px 12px}
  #drStage{flex:1 1 auto;min-width:0;min-height:0;position:relative;border-radius:14px;overflow:hidden;
    background:#f8f3e6;box-shadow:0 10px 30px rgba(0,0,0,.45), inset 0 0 0 1px rgba(90,70,40,.25)}
  #drSvg,#drPad{position:absolute;inset:0;width:100%;height:100%}
  #drSvg{transition:opacity .25s}
  #drPad{display:none;touch-action:none;cursor:crosshair}
  #drawM.practice #drPad{display:block}
  .drPracOnly{display:none!important}
  #drawM.practice .drPracOnly{display:inline-flex!important}
  #drSide{flex:0 0 260px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
  #drStepNo{font-size:11.5px;color:var(--steel);letter-spacing:.3px}
  #drStepName{font-size:19px;font-weight:800;color:var(--gold2);line-height:1.5}
  #drStepTxt{font-size:13.5px;line-height:1.95;color:var(--bone)}
  #drDots{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto;padding-top:8px}
  #drDots button{cursor:pointer;width:26px;height:26px;border-radius:50%;font-size:11px;font-family:inherit;color:var(--steel);
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);touch-action:manipulation}
  #drDots button.done{color:#cfe9d6;border-color:rgba(63,191,111,.5);background:rgba(63,191,111,.14)}
  #drDots button.on{color:#1a1208;font-weight:800;background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:transparent}
  #drCtl{flex:0 0 auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
  #drCtl .grp{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  #drCtl .stool{padding:8px 12px;font-size:12px}
  #drPrev .ic{transform:scaleX(-1)}
  /* بلا non-scaling-stroke: معه يحسب كروم طول التقطيع بمقياس الشاشة فلا يكتمل الخط */
  #drSvg .drS{fill:none;stroke:#2d2a26;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  #drSvg .drS.drNow{stroke:#a8432b;stroke-width:2.6}
  #drSvg .drD{fill:#2d2a26}
  #drSvg .drD.drNow{fill:#a8432b}
  #drSvg .drL line{stroke:#1d3f8f;stroke-width:1.6}
  #drSvg .drL circle{fill:#1d3f8f}
  #drSvg .drL text{fill:#1d3f8f;font-size:var(--drFs,17px);font-weight:700}
  @media (max-width:700px){
    #drBody{flex-direction:column;padding:6px 8px;gap:6px}
    #drSide{flex:0 0 auto;max-height:34%;padding:10px 12px;gap:4px}
    #drStepName{font-size:15px}
    #drStepTxt{font-size:12.5px;line-height:1.8}
    #drDots{display:none}
    #drCtl{gap:5px;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
    #drCtl .stool{padding:7px 9px;font-size:11px;min-height:36px}
    #drCtl .stool .ic + span{display:none}
    #drSpeed .stool{padding:7px 8px}
    .welDraw{top:calc(62px + env(safe-area-inset-top))!important}
  }
  #sheet{z-index:6}

  /* ═══════════ لوحة المفاتيح: حلقة تركيز على الجزء المختار ═══════════ */
  #svgHost .part:focus{outline:none}
  #svgHost .part:focus-visible{outline:none;filter:drop-shadow(0 0 5px #ffd166) drop-shadow(0 0 2px #ffd166)}

  /* ═══════════ ملء الشاشة: الرسم وحده ═══════════ */
  #fsExit,#fsTabsBtn{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:40;
    width:40px;height:40px;border-radius:12px;color:var(--bone);
    background:linear-gradient(180deg,rgba(40,33,46,.92),rgba(18,15,22,.92));
    border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.45)}
  #fsTabsBtn{left:58px}
  #fsExit .ic,#fsTabsBtn .ic{width:18px;height:18px}
  body.fs #top,body.fs #bar{display:none}
  body.fs #fsExit,body.fs #fsTabsBtn{display:inline-flex}
  body.fs.fsTabs #fsTabsBtn{color:#221607;background:linear-gradient(180deg,#ffe2a6,#e0ae4c)}
  body.fs #sceneHead{left:110px}
  /* «المواضيع» بملء الشاشة: شريط التبويبات يطفو فوق الرسم */
  body.fs.fsTabs #top{display:block;position:fixed;top:0;left:0;right:0;z-index:38;
    padding:calc(10px + env(safe-area-inset-top)) 16px 0 108px}
  body.fs.fsTabs #titleRow{display:none}
  body.fs.fsTabs #sceneHead{visibility:hidden}
  /* لوحة المعلومات تطفو فوق الرسم ولا تظهر إلا عند اختيار جزء */
  body.fs #wrap{position:relative}
  body.fs #info{position:absolute;top:10px;right:10px;bottom:10px;z-index:30;
    width:min(340px,86vw);max-height:none;border-radius:14px;
    box-shadow:0 18px 44px rgba(0,0,0,.5)}
  body.fs #info.closed{display:none}
  /* تنبيه لف الموبايل: يظهر بملء الشاشة على الشاشات العمودية الضيقة فقط */
  #rotHint{display:none;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:40;padding:9px 16px;border-radius:999px;font-size:12.5px;
    color:#221607;font-weight:700;white-space:nowrap;pointer-events:none;
    background:linear-gradient(180deg,#ffe2a6,#e0ae4c);box-shadow:0 8px 22px rgba(0,0,0,.35);
    animation:rotFade 5s ease forwards}
  @keyframes rotFade{0%,75%{opacity:1}100%{opacity:0}}
  @media (orientation:portrait) and (max-width:700px){ body.fs #rotHint{display:block} }

  /* ═══════════ الوضع النهاري ═══════════ */
  html[data-theme=day]{
    --ash:#eef0f3;--ash2:#e5e8ed;--smoke:#dde2e8;--bone:#1e2530;
    --ember:#d0561b;--ember2:#c96a12;--gold:#a8781c;--gold2:#7c5712;
    --steel:#5a6574;--line:rgba(130,100,40,.26);--glass:rgba(255,255,255,.86)}

    background:linear-gradient(165deg,rgba(255,255,255,.95),rgba(244,246,249,.92));

  html[data-theme=day] #titleRow .src{background:linear-gradient(180deg,#fff7e6,#f7ecd4);
    box-shadow:0 3px 10px rgba(120,90,30,.14), inset 0 1px 0 #fff}
  html[data-theme=day] #titleRow .src b{text-shadow:0 1px 0 #fff}
  html[data-theme=day] #tabsWrap::before{background:linear-gradient(270deg,#f5f6f8,transparent)}
  html[data-theme=day] #tabsWrap::after{background:linear-gradient(90deg,#f5f6f8,transparent)}
  html[data-theme=day] .tab{color:#4a5563;background:linear-gradient(180deg,#ffffff,#eef1f5);
    border-color:rgba(40,50,70,.14);box-shadow:0 2px 6px rgba(30,40,60,.08)}
  html[data-theme=day] .tab:hover{color:#1e2530}
  html[data-theme=day] .tab.on{color:#221607;border-color:rgba(160,110,20,.4);
    background:linear-gradient(180deg,#ffe2a6,#e0ae4c 55%,#c2902f);
    box-shadow:0 6px 16px rgba(190,140,40,.34), inset 0 1px 0 rgba(255,255,255,.62)}
  html[data-theme=day] .btn.ghost:hover{color:#111820}

  html[data-theme=day] #stage{background:
      radial-gradient(1000px 620px at 50% 42%, var(--tint1,rgba(70,120,104,.30)), transparent 68%),
      radial-gradient(700px 500px at 82% 88%, var(--tint2,rgba(60,90,130,.18)), transparent 70%),
      linear-gradient(180deg,#f7f8fa,#e9edf1)}
  html[data-theme=day] #stage::before{opacity:.5}
  html[data-theme=day] #stage::after{background:radial-gradient(120% 100% at 50% 45%, transparent 60%, rgba(40,50,70,.12) 100%)}
  html[data-theme=day] #sceneName{background:rgba(255,255,255,.86)}
  html[data-theme=day] #sceneHint{color:#3b4452;background:rgba(255,255,255,.82);border-color:rgba(40,50,70,.1)}

  html[data-theme=day] .btn,html[data-theme=day] .stool{color:#2c3542;
    background:linear-gradient(180deg,#ffffff 0%,#f1f3f6 60%,#e6eaef 100%);
    border-color:rgba(40,50,70,.16);
    box-shadow:0 3px 9px rgba(30,40,60,.12), 0 1px 0 #fff inset, 0 -6px 12px rgba(30,40,60,.05) inset}
  html[data-theme=day] .btn:hover,html[data-theme=day] .stool:hover{color:#111820;border-color:rgba(168,120,28,.6)}
  html[data-theme=day] .btn::after,html[data-theme=day] .stool::after{background:linear-gradient(90deg,transparent,#fff,transparent)}
  html[data-theme=day] .btn.ghost{color:#3f4a58;background:linear-gradient(180deg,#ffffff,#f0f2f5)}
  html[data-theme=day] .btn.primary{color:#2a1503;
    background:linear-gradient(180deg,#ffc978 0%,var(--ember) 55%,#b34a12 100%)}
  html[data-theme=day] .stool.on,html[data-theme=day] .segbar .stool.on{color:#221607;
    background:linear-gradient(180deg,#ffe2a6 0%,#e0ae4c 52%,#bd8b2c 100%)}
  html[data-theme=day] .segbar,html[data-theme=day] #sceneTools .grp{
    background:rgba(255,255,255,.82);border-color:rgba(40,50,70,.12);
    box-shadow:0 8px 22px rgba(30,40,60,.12)}
  html[data-theme=day] .segbar .stool{background:transparent;box-shadow:none;color:#4a5563}
  html[data-theme=day] .iconBtn,html[data-theme=day] #infoClose,html[data-theme=day] #sheetClose{
    color:#4a5563;background:#fff;border-color:rgba(40,50,70,.16)}
  html[data-theme=day] #fsExit,html[data-theme=day] #fsTabsBtn{color:#2c3542;background:linear-gradient(180deg,#ffffff,#eef1f5)}
  html[data-theme=day] body.fs.fsTabs #fsTabsBtn{color:#221607;background:linear-gradient(180deg,#ffe2a6,#e0ae4c)}
  html[data-theme=day] .sliderWrap{background:rgba(255,255,255,.9);border-color:rgba(40,50,70,.12)}

  html[data-theme=day] #phaseBar .pdesc{color:#3b4452}
  html[data-theme=day] #info{background:linear-gradient(180deg,#ffffff,#f3f5f8);border-color:rgba(40,50,70,.12)}
  html[data-theme=day] .fld{background:#f6f7f9;border-color:rgba(40,50,70,.08)}
  html[data-theme=day] .fld p{color:#28303b}
  html[data-theme=day] .fld.note{background:linear-gradient(180deg,#fff3e8,#fdeee0)}
  html[data-theme=day] .fld.note p{color:#7a3a0c}
  html[data-theme=day] #infoEmpty .hintCard{background:#fbf6ea;color:#4a4436;border-color:rgba(168,120,28,.4)}
  html[data-theme=day] .slot:not(.done):not(.hot){stroke:rgba(168,120,28,.75);fill:rgba(255,255,255,.9)}
  html[data-theme=day] #phaseBar .pchrom,html[data-theme=day] #phaseBar .psrc{color:#4a5563}
  html[data-theme=day] #seeFn:disabled{background:#eef0f3;color:#8a94a2}

  html[data-theme=day] #bar{background:linear-gradient(0deg,#ffffff,#f3f5f8);
    box-shadow:0 -6px 18px rgba(30,40,60,.08)}
  html[data-theme=day] #bar .ctl{background:#f5f6f8;border-color:rgba(40,50,70,.12)}
  html[data-theme=day] .tgl{background:linear-gradient(180deg,#ffffff,#f0f2f5);border-color:rgba(40,50,70,.14);color:#4a5563}
  html[data-theme=day] .tgl:has(input:checked){color:#1e2530;border-color:rgba(208,86,27,.4);
    background:linear-gradient(180deg,#fff5ec,#fde9d8)}
  html[data-theme=day] .tgl input:not(:checked){background:linear-gradient(180deg,#d3d8df,#e9ecf0);
    border-color:rgba(40,50,70,.18);box-shadow:inset 0 2px 4px rgba(30,40,60,.25)}
  html[data-theme=day] input[type=range]::-webkit-slider-runnable-track{
    background:linear-gradient(90deg,#ff9a4d 0%,var(--ember) var(--p),#d6dbe2 var(--p));
    box-shadow:inset 0 1px 3px rgba(30,40,60,.3)}
  html[data-theme=day] input[type=range]::-moz-range-track{background:#d8dde4}

  html[data-theme=day] #sheetHead{background:linear-gradient(180deg,rgba(208,86,27,.08),transparent)}
  html[data-theme=day] th,html[data-theme=day] td{border-bottom-color:rgba(40,50,70,.1)}
  html[data-theme=day] td{color:#28303b}
  html[data-theme=day] th{background:linear-gradient(180deg,#fdf0e2,#f8e9d8)}
  html[data-theme=day] tbody tr:nth-child(odd){background:rgba(40,50,70,.03)}

  /* مخطط الأيض بالنهاري: بطاقات بيضاء بحواف ملوّنة بدل المربعات الباهتة */
  html[data-theme=day] #svgHost[data-scene=metabolism] rect[filter]{
    fill:#ffffff;fill-opacity:.94;stroke-width:2.8;filter:drop-shadow(0 3px 6px rgba(30,40,60,.16))}

  /* أسماء الرسوم: حبر غامق بهالة بيضاء */
  html[data-theme=day] .lbl{fill:#18202b;stroke:rgba(255,255,255,.92)}
  html[data-theme=day] .lead{stroke:rgba(30,40,55,.55)}
  html[data-theme=day] .lblDot{fill:#c96a12}
  html[data-theme=day] .cap{fill:#6e4c0e;stroke:rgba(255,255,255,.9)}

  html[data-theme=day] #exam{background:
      radial-gradient(900px 560px at 50% 36%, rgba(70,120,104,.16), transparent 66%),
      linear-gradient(180deg,#f7f8fa,#e9edf1)}
  html[data-theme=day] #examTop{background:linear-gradient(180deg,#ffffff,transparent)}
  html[data-theme=day] .seg,html[data-theme=day] #score{background:#fff;border-color:rgba(40,50,70,.12)}
  html[data-theme=day] #tray{background:linear-gradient(0deg,#ffffff,rgba(255,255,255,.8))}
  html[data-theme=day] .chip{color:#1e2530;background:linear-gradient(180deg,#ffffff,#eef1f5);
    border-color:rgba(40,50,70,.16);box-shadow:0 3px 9px rgba(30,40,60,.12)}
  html[data-theme=day] .chip.done{color:#1f7a45;background:linear-gradient(180deg,#e3f6ea,#d3efdd)}
  html[data-theme=day] .slotTxt{fill:#1f7a45}
  html[data-theme=day] .opt{color:#1e2530;background:linear-gradient(180deg,#ffffff,#f3f5f8);
    border-color:rgba(40,50,70,.12);box-shadow:0 3px 9px rgba(30,40,60,.08)}
  html[data-theme=day] .opt.good{color:#1f6b3e}
  html[data-theme=day] .opt.bad{color:#9a2a20}

  /* ═══════════ توحيد الألوان ووضوح الكتابة ═══════════
     لون تمييز واحد (الذهبي) لكل زر أساسي أو مفعّل: الأزرار، المفاتيح، المنزلقات، الشرائح
     ونصوص مساعدة أكبر وأوضح تباين في الوضعين */
  :root{--steel:#aab3bf;--goldOn:linear-gradient(180deg,#ffe2a6 0%,#e0ae4c 52%,#bd8b2c 100%)}
  html[data-theme=day]{--steel:#46505e}
  .btn.primary,html[data-theme=day] .btn.primary{color:#221607;background:var(--goldOn);border-color:rgba(255,255,255,.4);
    box-shadow:0 8px 20px rgba(224,174,76,.38), 0 1px 0 rgba(255,255,255,.65) inset, 0 -6px 12px rgba(120,80,10,.28) inset}
  .btn.primary:hover{box-shadow:0 12px 28px rgba(224,174,76,.5), 0 1px 0 rgba(255,255,255,.7) inset}
  .tgl:has(input:checked){border-color:rgba(224,174,76,.5);background:linear-gradient(180deg,rgba(224,174,76,.16),rgba(224,174,76,.05))}
  .tgl input:checked{background:linear-gradient(90deg,#bd8b2c,#e0ae4c);border-color:rgba(224,174,76,.6);
    box-shadow:inset 0 1px 4px rgba(0,0,0,.3), 0 0 12px rgba(224,174,76,.35)}
  .tgl input:checked::after{background:radial-gradient(circle at 35% 30%,#fff,#fff1d2)}
  html[data-theme=day] .tgl:has(input:checked){border-color:rgba(168,120,28,.45);background:linear-gradient(180deg,#fffaf0,#fbefd6)}
  input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,#f5d089 0%,#e0ae4c var(--p),rgba(255,255,255,.14) var(--p))}
  html[data-theme=day] input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(90deg,#e8c172 0%,#c2902f var(--p),#d6dbe2 var(--p))}
  input[type=range]::-moz-range-progress{background:#e0ae4c}
  #score b,#phaseBar .pchrom b{color:var(--gold2)}
  .chip.drag{border-color:var(--gold)}
  .slot.hot{fill:rgba(224,174,76,.2);stroke:var(--gold)}
  html[data-theme=day] #sheetHead{background:linear-gradient(180deg,rgba(168,120,28,.08),transparent)}
  html[data-theme=day] th{background:linear-gradient(180deg,#fdf5e4,#f8edd6)}
  #v3Btn.on,html[data-theme=day] #v3Btn.on{color:#221607;background:var(--goldOn);border-color:rgba(255,255,255,.4)}

  /* نصوص صغيرة كانت باهتة: حجم أكبر ولون أوضح */
  #titleRow .sub{font-size:12.5px;letter-spacing:.6px}
  #titleRow .src span{font-size:11.5px;letter-spacing:.3px;color:var(--steel)}
  #sceneName b{font-size:12px;color:var(--steel)}
  #sceneHint{font-size:12.5px;color:#d6cfc3}
  html[data-theme=day] #sceneHint{color:#2c3542}
  #phaseBar .pdesc{font-size:12.5px;color:#e2dbcf}
  #phaseBar .pchrom{font-size:12px}
  #phaseBar .pcap{font-size:12px}
  #phaseBar .psrc{font-size:11.5px;opacity:1}
  #infoSrc{font-size:12px}
  .fld h5{font-size:12px;letter-spacing:.6px}
  #bar label{font-size:12px}
  #bar output{font-size:12.5px}
  .slotTxt{font-size:12px}
  .slot{stroke:rgba(245,208,137,.8);fill:rgba(236,228,216,.08)}
  #pickRow > span,#qMeta{font-size:12px}
  /* «اختر الرسم:» فقط بلون رمادي؛ كتابة الأزرار تبقى بلون الزر (كانت تختفي على الزر الذهبي) */
  #pickRow .stool span{color:inherit;font-size:inherit}
  /* شرح المشهد: سطران فقط حتى لا يغطي أسماء الرسم، ويُفتح كاملاً بالمرور أو الضغط */
  #sceneHint{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;cursor:pointer;
    transition:background .2s}
  #sceneHint:hover,#sceneHint.open{-webkit-line-clamp:unset;display:block;position:relative;z-index:6}
  .btn.ghost,.tgl{color:#d0c9be}
  html[data-theme=day] .btn.ghost,html[data-theme=day] .tgl{color:#2c3542}
  .lbl.sm{font-size:12.5px}
  /* الأسماء غير المختارة تخفت قليلاً فقط حتى تبقى مقروءة */
  #svgHost.dim #labelLayer .lblG:not(.sel),#lbl3d.dim .lblG:not(.sel){opacity:.55}
  #lbl3d.compact .lbl{font-size:10.6px}
  #lbl3d.compact .cap3d .c1{font-size:12px}
  #lbl3d.compact .cap3d .c2{font-size:10.5px}
  @media (max-width:700px){
    #lbl3d .lbl{font-size:11.5px}
    #bar{font-size:12px}
    #drCtl .stool{font-size:12px}
  }
  #drStepNo{font-size:12.5px}
  #drDots button{font-size:12px;color:#d0c9be}
  /* الرسم اليدوي بالوضع النهاري */
  html[data-theme=day] #drawM{background:radial-gradient(900px 560px at 50% 36%, rgba(200,170,110,.18), transparent 66%),linear-gradient(180deg,#f6f7f9,#e9edf1)}
  html[data-theme=day] #drStage{box-shadow:0 8px 24px rgba(30,40,60,.16), inset 0 0 0 1px rgba(90,70,40,.22)}
  html[data-theme=day] #drStepTxt{color:#28303b}
  html[data-theme=day] #drDots button{color:#3f4a58;background:#fff;border-color:rgba(40,50,70,.18)}
  html[data-theme=day] #drDots button.done{color:#1f6b3a;background:#e7f6ec;border-color:rgba(63,191,111,.5)}
  html[data-theme=day] #drDots button.on{color:#221607;background:var(--goldOn)}
  /* عدّادات ATP في مخطط الأيض بالنهاري: إطار وكتابة أوضح */
  html[data-theme=day] #svgHost[data-scene=metabolism] rect[rx="13"]{fill:#fffaf0;stroke:#c2902f}
  html[data-theme=day] #svgHost[data-scene=metabolism] circle[stroke-dasharray]{stroke:#b07d1e;fill:#fff}

  /* ═══════════ الموبايل (عمودي وعرضي): الرسم ياخذ كل المساحة ═══════════
     لوحة المعلومات تظهر فقط عند اختيار جزء ولا تحجز نصف الشاشة وهي فارغة */
  @media (max-width:880px),(orientation:portrait),(max-height:520px){
    #info.closed{display:none}
    #info{flex:0 0 46%;max-height:46%}
    #infoHead{padding:9px 14px 8px}
    #infoClose{width:36px;height:36px}
    /* شرح المشهد يغطي الأسماء على الشاشة الصغيرة: نخفيه (الطريقة مكتوبة على الأزرار) */
    #sceneHint,#sceneHint.open{display:none}
    #sceneHead{top:8px;right:8px;left:8px}
    #sceneName{font-size:12px;padding:4px 11px}
    #sceneName b{font-size:10px}
  }
  /* موبايل عمودي ضيق: شريط سفلي بصف واحد يكفي بدون سحب */
  @media (max-width:480px) and (orientation:portrait){
    #bar{gap:6px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));justify-content:space-between}
    #bar .btn,#bar .tgl{min-height:40px;padding:8px 10px}
    #bar .btn span,#playTxt{display:none}
    /* التأثيرات والسرعة نادراً تُستخدم على الموبايل؛ «الأسماء» زر أيقونة يضيء حين يكون مفعّلاً */
    #bar .tgl:has(#glowTgl),#bar .ctl{display:none}
    #bar .tgl input{display:none}
    #bar .tgl .ic{width:17px;height:17px;opacity:1}
    #bar .btn .ic{width:17px;height:17px}
    #playBtn{min-width:0}
  }
  /* موبايل بالعرض: العنوان والتبويبات بسطر واحد، والشريط السفلي رفيع، واللوحة جانبية */
  @media (orientation:landscape) and (max-height:520px){
    #top{display:flex;align-items:center;gap:10px;padding:5px 10px 0}
    #titleRow{flex:0 0 auto;flex-wrap:nowrap;gap:8px;padding-bottom:5px}
    #titleRow .sub,#titleRow .src span{display:none}
    #titleRow h1{font-size:15px;letter-spacing:1px}
    #titleRow .src{padding:3px 9px;margin:0}
    #titleRow .src b{font-size:11px}
    #tabsWrap{flex:1 1 auto;min-width:0;margin-top:0}
    #tabs{padding-bottom:5px}
    .tab{padding:6px 12px;font-size:11.5px}
    #wrap{flex-direction:row-reverse}
    #info{flex:0 0 min(330px,44%);max-height:none;width:auto;border-top:0;
      border-inline-end:1px solid var(--line);box-shadow:-14px 0 30px rgba(0,0,0,.4)}
    #bar{padding:4px 8px calc(4px + env(safe-area-inset-bottom));gap:5px}
    #bar .btn,#bar .tgl{min-height:34px;padding:5px 11px;font-size:11.5px}
    #bar .ctl{padding:2px 8px}
    .tgl input{width:30px;height:18px}
    .tgl input::after{width:12px;height:12px}
    .tgl input:checked::after{right:calc(100% - 14px)}
    #sceneTools{bottom:5px;right:6px;left:6px}
    #sceneTools .stool,#sceneTools .segb{min-height:32px;padding:5px 10px;font-size:11.5px}
    #phaseBar{top:40px;padding:6px 9px}
  }
  @media (orientation:landscape) and (max-height:520px){
    #bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
    #bar::-webkit-scrollbar{display:none}
    #bar > *{flex:0 0 auto}
  }
  @media (orientation:landscape) and (max-height:520px) and (max-width:1020px){
    #bar .btn.ghost span,#bar .ctl > label{display:none}
  }
  /* الأجهزة اللمسية: بدون تمويه زجاجي وحركة خلفية (أثقل شي على معالج الرسوم) */
  html.phone *,html.phone *::before,html.phone *::after{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  html.phone #stage::before{animation:none}
  body.rotTip #rotHint{display:block}
  #bar .tgl:has(input:checked){color:var(--gold2)}

  /* لوحة الطور على الشاشة الصغيرة: الاسم فقط، ويُفتح الوصف بالضغط عليها حتى لا تغطي الرسم */
  @media (max-width:880px),(max-height:520px){
