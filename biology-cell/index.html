<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>الخلية — محاكي تفاعلي · أحياء السادس الإعدادي</title>
<style>
  :root{
    /* نفس لوحة محاكي «حرب التنانين» للحفاظ على وحدة الواجهة */
    --ash:#0d0b0c;
    --smoke:#1a1516;
    --bone:#e8ded0;
    --ember:#ff6a1f;
    --blood:#a8221b;
    --gold:#d9a441;
    --steel:#7d8894;
    /* ألوان حيوية للرسوم */
    --cyto:#8fb9a8;
    --nucleus:#7b6ccc;
    --mito:#d9713f;
    --golgi:#d2689a;
    --lyso:#9a5fc4;
    --chloro:#4f9e4a;
    --vac:#5f9cc4;
    --wall:#b39a63;
    --ok:#3fbf6f;
    --bad:#d4483c;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--ash);
    font-family:"Segoe UI","Tahoma","Noto Naskh Arabic",sans-serif;color:var(--bone)}
  body{display:flex;flex-direction:column;overscroll-behavior:none}
  button,input,select{font-family:inherit}

  .panel{
    background:linear-gradient(180deg,rgba(14,11,12,.86),rgba(14,11,12,.66));
    border:1px solid rgba(217,164,65,.28);
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
    backdrop-filter:blur(3px);
  }

  /* ═══════════ الرأس والتبويبات ═══════════ */
  #top{flex:0 0 auto;padding:10px 16px 0;border-bottom:1px solid rgba(217,164,65,.16);
    background:linear-gradient(180deg,#100d0e,#0d0b0c)}
  #titleRow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  #titleRow h1{font-size:clamp(16px,2.3vw,25px);font-weight:600;letter-spacing:clamp(2px,.5vw,6px);
    color:var(--bone);text-shadow:0 0 30px rgba(255,106,31,.25)}
  #titleRow .sub{color:var(--gold);letter-spacing:2px;font-size:11px}
  #titleRow .src{margin-inline-start:auto;font-size:10.5px;color:var(--steel);letter-spacing:1px}

  #tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;overflow-y:hidden;
    scrollbar-width:thin;scrollbar-color:rgba(217,164,65,.35) transparent}
  #tabs::-webkit-scrollbar{height:4px}
  #tabs::-webkit-scrollbar-thumb{background:rgba(217,164,65,.3)}
  .tab{cursor:pointer;white-space:nowrap;font-size:12px;letter-spacing:1.5px;padding:10px 13px;
    color:var(--steel);background:rgba(255,255,255,.03);border:0;border-bottom:2px solid transparent;
    transition:color .18s,border-color .18s,background .18s}
  .tab:hover{color:var(--bone)}
  .tab.on{color:var(--gold);border-bottom-color:var(--ember);background:rgba(255,106,31,.07)}
  .tab:focus-visible{outline:2px solid var(--bone);outline-offset:-2px}

  /* ═══════════ الجسم: مسرح + لوحة معلومات ═══════════ */
  #wrap{flex:1 1 auto;display:flex;flex-direction:row-reverse;min-height:0}

  #stage{position:relative;flex:1 1 auto;min-width:0;min-height:0;
    background:radial-gradient(ellipse at 50% 45%,#141a19 0%,#0c0a0b 72%)}
  #svgHost{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
  #fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  #sceneHead{position:absolute;top:10px;right:14px;left:14px;pointer-events:none;
    display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
  #sceneName{font-size:13px;letter-spacing:2px;color:var(--gold)}
  #sceneHint{font-size:11px;color:var(--steel);line-height:1.7;max-width:62%;text-align:left}

  /* لوحات فوق المسرح (أزرار خاصة بكل مشهد) */
  #sceneTools{position:absolute;bottom:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px;
    max-width:calc(100% - 24px)}
  .stool{cursor:pointer;font-size:11.5px;letter-spacing:1px;color:var(--bone);padding:8px 12px;
    background:linear-gradient(180deg,rgba(26,21,22,.92),rgba(13,11,12,.8));
    border:1px solid rgba(217,164,65,.3);
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  .stool:hover{border-color:var(--gold);color:var(--gold)}
  .stool.on{color:var(--ash);background:var(--gold);border-color:var(--gold);font-weight:600}
  .stool:focus-visible{outline:2px solid var(--bone);outline-offset:2px}

  /* شريط أطوار الانقسام */
  #phaseBar{position:absolute;top:44px;left:14px;width:min(250px,44vw);padding:10px 13px;display:none}
  #phaseBar.on{display:block}
  #phaseBar .pname{color:var(--gold);font-size:12.5px;letter-spacing:1.5px;margin-bottom:5px}
  #phaseBar .pdesc{font-size:11.5px;color:var(--bone);line-height:1.75;opacity:.9}
  #phaseBar .pchrom{margin-top:7px;font-size:11px;color:var(--steel);letter-spacing:1px}
  #phaseBar .pcap{margin-top:7px;padding-top:7px;border-top:1px solid rgba(217,164,65,.14);
    font-size:11px;color:var(--gold);line-height:1.6;opacity:.9}
  #phaseBar .pchrom b{color:var(--ember);font-variant-numeric:tabular-nums}

  /* ═══════════ لوحة المعلومات ═══════════ */
  #info{width:min(340px,34vw);flex:0 0 auto;display:flex;flex-direction:column;
    background:linear-gradient(270deg,rgba(9,8,9,.97) 0%,rgba(11,10,11,.94) 80%,rgba(11,10,11,.9) 100%);
    border-inline-end:1px solid rgba(217,164,65,.16);text-align:right}
  #infoHead{flex:0 0 auto;padding:14px 16px 10px;border-bottom:1px solid rgba(217,164,65,.14);
    display:flex;align-items:flex-start;gap:8px}
  #infoName{font-size:15px;color:var(--bone);letter-spacing:1.5px;font-weight:600;line-height:1.5}
  #infoClose{margin-inline-start:auto;cursor:pointer;background:transparent;border:1px solid rgba(125,136,148,.3);
    color:var(--steel);font-size:13px;width:26px;height:26px;flex:0 0 auto}
  #infoClose:hover{color:var(--bone);border-color:var(--bone)}
  #infoBody{flex:1 1 auto;overflow-y:auto;padding:14px 16px 18px;
    scrollbar-width:thin;scrollbar-color:rgba(217,164,65,.35) transparent}
  #infoBody::-webkit-scrollbar{width:6px}
  #infoBody::-webkit-scrollbar-thumb{background:rgba(217,164,65,.3)}
  .fld{margin-bottom:14px}
  .fld h5{font-size:10px;letter-spacing:3px;color:var(--gold);opacity:.85;font-weight:600;
    margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid rgba(217,164,65,.14)}
  .fld p{font-size:12.5px;line-height:1.95;color:var(--bone);opacity:.94}
  .fld.note p{color:#ffd9a8}
  .fld ul{list-style:none;font-size:12.5px;line-height:1.95}
  .fld li{padding-inline-start:14px;position:relative}
  .fld li::before{content:'▪';position:absolute;inset-inline-start:0;color:var(--gold);opacity:.7}
  #infoFoot{flex:0 0 auto;padding:12px 16px;border-top:1px solid rgba(217,164,65,.14);display:flex;gap:8px}
  #seeFn{flex:1;cursor:pointer;font-size:12px;letter-spacing:2px;color:var(--ash);
    background:linear-gradient(180deg,#ffb14d,var(--ember));border:0;padding:12px 10px;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
  #seeFn:hover{filter:brightness(1.12)}
  #seeFn:disabled{background:rgba(255,255,255,.06);color:var(--steel);cursor:default;filter:none}
  #seeFn:focus-visible{outline:2px solid var(--bone);outline-offset:3px}
  #infoEmpty{padding:18px 16px;font-size:12.5px;line-height:2;color:var(--steel)}
  #infoEmpty b{color:var(--gold)}

  /* ═══════════ شريط التحكم ═══════════ */
  #bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:9px 16px;border-top:1px solid rgba(217,164,65,.16);
    background:linear-gradient(0deg,#100d0e,#0d0b0c);font-size:12px}
  #bar .ctl{display:flex;align-items:center;gap:7px}
  #bar label{color:var(--steel);letter-spacing:1px;white-space:nowrap}
  #bar input[type=range]{accent-color:var(--ember);width:104px;height:16px}
  #bar output{color:var(--bone);opacity:.75;font-variant-numeric:tabular-nums;min-width:30px;text-align:left}
  .tgl{cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--steel);letter-spacing:1px}
  .tgl input{accent-color:var(--ember);width:15px;height:15px}
  .tgl:hover{color:var(--bone)}
  #playBtn{cursor:pointer;letter-spacing:2px;color:var(--gold);padding:8px 16px;
    background:rgba(255,106,31,.08);border:1px solid rgba(217,164,65,.4);
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
  #playBtn:hover{background:rgba(255,106,31,.16)}
  #playBtn:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
  #barSpacer{margin-inline-start:auto}
  #resetBtn{cursor:pointer;font-size:11px;letter-spacing:1.5px;color:var(--steel);
    background:transparent;border:1px solid rgba(125,136,148,.28);padding:8px 12px}
  #resetBtn:hover{color:var(--bone);border-color:var(--bone)}

  /* ═══════════ رسم SVG: حالات التفاعل ═══════════ */
  .part{cursor:pointer}
  #svgHost.dim .part:not(.sel){opacity:.22}
  #svgHost.dim .part:not(.sel):has(.part.sel){opacity:1}
  .part.sel{filter:url(#fGlow)}
  .lbl{pointer-events:none;font-size:13px;letter-spacing:.5px;fill:var(--bone)}
  .lbl.sm{font-size:11.5px}
  .lead{pointer-events:none;stroke:rgba(232,222,208,.45);stroke-width:1;fill:none}
  .lblDot{pointer-events:none;fill:var(--gold)}
  #labelLayer.off{display:none}
  .cap{pointer-events:none;font-size:14px;letter-spacing:1px;fill:var(--gold)}

  /* ═══════════ جداول المقارنة ═══════════ */
  #sheet{position:absolute;inset:auto 14px 56px 14px;max-height:66%;display:none;
    flex-direction:column;overflow:hidden}
  #sheet.on{display:flex}
  #sheetHead{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:11px 14px;
    border-bottom:1px solid rgba(217,164,65,.18)}
  #sheetHead h4{font-size:12.5px;color:var(--gold);letter-spacing:1.5px;font-weight:600}
  #sheetClose{margin-inline-start:auto;cursor:pointer;background:transparent;
    border:1px solid rgba(125,136,148,.3);color:var(--steel);width:24px;height:24px;font-size:12px}
  #sheetBody{flex:1 1 auto;overflow:auto;padding:4px 0 8px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:8px 12px;text-align:right;border-bottom:1px solid rgba(125,136,148,.14);line-height:1.7}
  th{color:var(--gold);font-weight:600;font-size:11px;letter-spacing:1.5px;
    background:rgba(255,106,31,.06);position:sticky;top:0}
  td:first-child{color:var(--steel)}

  /* ═══════════ وضع الامتحان ═══════════ */
  #exam{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;
    background:radial-gradient(ellipse at 50% 40%,#141a19 0%,#0c0a0b 75%)}
  #exam.on{display:flex}
  #examTop{flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:10px 14px;border-bottom:1px solid rgba(217,164,65,.16)}
  #examTop .seg{display:flex;gap:2px}
  #examTop .seg button{cursor:pointer;font-size:11.5px;letter-spacing:1px;padding:8px 12px;
    color:var(--steel);background:rgba(255,255,255,.03);border:1px solid rgba(125,136,148,.2)}
  #examTop .seg button.on{color:var(--ash);background:var(--gold);border-color:var(--gold);font-weight:600}
  #score{margin-inline-start:auto;font-size:12px;color:var(--steel);letter-spacing:1px}
  #score b{color:var(--ember);font-variant-numeric:tabular-nums;font-size:15px}
  #examBody{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column}

  /* أشّر الأجزاء */
  #dragWrap{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  #pickRow{flex:0 0 auto;display:flex;gap:6px;flex-wrap:wrap;padding:9px 14px;
    border-bottom:1px solid rgba(217,164,65,.12);align-items:center}
  #pickRow span{font-size:11px;color:var(--steel);letter-spacing:1px}
  #dragStage{flex:1 1 auto;min-height:0;position:relative}
  #dragSvgHost{position:absolute;inset:0;width:100%;height:100%}
  #tray{flex:0 0 auto;display:flex;gap:7px;flex-wrap:wrap;padding:10px 14px;max-height:34%;overflow-y:auto;
    border-top:1px solid rgba(217,164,65,.14);background:rgba(9,8,9,.6)}
  .chip{cursor:grab;touch-action:none;font-size:12px;letter-spacing:.5px;color:var(--bone);
    padding:8px 12px;background:linear-gradient(180deg,rgba(38,31,28,.95),rgba(20,16,17,.9));
    border:1px solid rgba(217,164,65,.35);white-space:nowrap;user-select:none;
    clip-path:polygon(7px 0,100% 0,100% calc(100% - 7px),calc(100% - 7px) 100%,0 100%,0 7px)}
  .chip.drag{position:fixed;z-index:60;cursor:grabbing;border-color:var(--ember);
    box-shadow:0 8px 24px rgba(0,0,0,.6);pointer-events:none}
  .chip.done{cursor:default;color:#9fe9b9;border-color:rgba(63,191,111,.6);background:rgba(63,191,111,.12)}
  .chip.wrong{animation:shake .32s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .slot{fill:rgba(232,222,208,.06);stroke:rgba(217,164,65,.55);stroke-width:1.4;stroke-dasharray:4 3}
  .slot.hot{fill:rgba(255,106,31,.18);stroke:var(--ember);stroke-dasharray:none}
  .slot.done{fill:rgba(63,191,111,.16);stroke:var(--ok);stroke-dasharray:none}
  .slotTxt{pointer-events:none;font-size:10.5px;fill:#9fe9b9;letter-spacing:.2px}
  #dragDone{padding:12px 14px;font-size:12.5px;color:var(--gold);line-height:1.8;display:none}
  #dragDone.on{display:block}

  /* اختبر نفسك */
  #quiz{flex:1 1 auto;overflow-y:auto;padding:16px 16px 22px;display:none}
  #quiz.on{display:block}
  #qMeta{font-size:11px;color:var(--steel);letter-spacing:1.5px;margin-bottom:9px}
  #qText{font-size:14.5px;line-height:1.95;color:var(--bone);margin-bottom:14px}
  #qOpts{display:flex;flex-direction:column;gap:8px;max-width:760px}
  .opt{cursor:pointer;text-align:right;font-size:13px;line-height:1.8;color:var(--bone);
    padding:11px 13px;background:rgba(255,255,255,.035);border:1px solid rgba(125,136,148,.22);
    transition:border-color .18s,background .18s}
  .opt:hover:not(:disabled){border-color:var(--gold)}
  .opt:disabled{cursor:default}
  .opt.good{border-color:var(--ok);background:rgba(63,191,111,.14);color:#c8f2d8}
  .opt.bad{border-color:var(--bad);background:rgba(212,72,60,.12);color:#f6c9c4}
  #qWhy{margin-top:14px;padding:12px 14px;font-size:12.5px;line-height:1.95;display:none;max-width:760px}
  #qWhy.on{display:block}
  #qWhy b{color:var(--gold)}
  #qNext{margin-top:14px;cursor:pointer;font-size:12px;letter-spacing:2px;color:var(--ash);
    background:linear-gradient(180deg,#ffb14d,var(--ember));border:0;padding:11px 22px;display:none;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
  #qNext.on{display:inline-block}

  /* ═══════════ موبايل ═══════════ */
  @media (max-width:860px),(orientation:portrait){
    #wrap{flex-direction:column}
    #stage{flex:1 1 auto}
    #info{width:100%;flex:0 0 auto;max-height:46%;border-inline-end:0;
      border-top:1px solid rgba(217,164,65,.2);
      background:linear-gradient(0deg,rgba(9,8,9,.98),rgba(11,10,11,.95))}
    #info.closed #infoBody,#info.closed #infoFoot,#info.closed #infoEmpty{display:none}
    #sheet{inset:auto 8px 8px 8px;max-height:72%}
    #sceneHint{display:none}
    #phaseBar{width:min(210px,56vw);left:8px;top:40px;padding:8px 10px}
    .lbl{font-size:16px}
    .lbl.sm{font-size:14px}
    .lead{stroke-width:1.4}
    .lblDot{r:4.4}
    #bar{gap:8px;padding:8px 10px;font-size:11.5px}
    #bar input[type=range]{width:74px}
    #titleRow .src{display:none}
    th,td{padding:7px 9px;font-size:11.5px}
  }
  @media (max-width:420px){
    #titleRow h1{font-size:15px;letter-spacing:1px}
    #bar label{display:none}
    #bar input[type=range]{width:64px}
    .tab{padding:9px 10px;font-size:11.5px}
  }

  /* ── حالات التحديد على الرسم ── */
  .part{transition:opacity .28s,transform .3s}
  .part.sel{transform-box:fill-box;transform-origin:center;transform:scale(1.06)}
  .part.sel[data-part=cyto],.part.sel[data-part=pm],.part.sel[data-part=wall],
  .part.sel[data-part=bilayer],.part.sel[data-part=nucleoplasm],.part.sel[data-part=env],
  .part.sel[data-part=chromatin]{transform:none}
  #svgHost.flat *{filter:none!important}
  .lbl,.cap,.slotTxt{direction:rtl}
  #dragSvgHost .part{pointer-events:none;cursor:default}
  #sceneTools input[type=range]{cursor:pointer}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>

<header id="top">
  <div id="titleRow">
    <h1>الخلية</h1>
    <div class="sub">محاكي تفاعلي · الفصل الأول · أحياء السادس الإعدادي</div>
    <div class="src">اضغط أي جزء من الرسم لتظهر معلوماته</div>
  </div>
  <nav id="tabs"></nav>
</header>

<main id="wrap">
  <section id="stage">
    <svg id="svgHost" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="مشهد تفاعلي للخلية"></svg>
    <canvas id="fx" aria-hidden="true"></canvas>

    <div id="sceneHead">
      <div id="sceneName"></div>
      <div id="sceneHint"></div>
    </div>

    <div id="phaseBar" class="panel">
      <div class="pname" id="phaseName"></div>
      <div class="pdesc" id="phaseDesc"></div>
      <div class="pchrom" id="phaseChrom"></div>
      <div class="pcap" id="phaseCap"></div>
    </div>

    <div id="sceneTools"></div>

    <div id="sheet" class="panel">
      <div id="sheetHead">
        <h4 id="sheetTitle"></h4>
        <button id="sheetClose" title="إغلاق">✕</button>
      </div>
      <div id="sheetBody"></div>
    </div>

    <!-- ═══════════ وضع الامتحان ═══════════ -->
    <div id="exam">
      <div id="examTop">
        <div class="seg">
          <button id="mLabel" class="on">أشّر الأجزاء</button>
          <button id="mQuiz">اختبر نفسك</button>
        </div>
        <div id="score"></div>
      </div>

      <div id="examBody">
        <div id="dragWrap">
          <div id="pickRow">
            <span>اختر الرسم:</span>
          </div>
          <div id="dragStage">
            <svg id="dragSvgHost" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"
                 role="img" aria-label="رسم بدون أسماء للتأشير"></svg>
          </div>
          <div id="dragDone"></div>
          <div id="tray"></div>
        </div>

        <div id="quiz">
          <div id="qMeta"></div>
          <div id="qText"></div>
          <div id="qOpts"></div>
          <div id="qWhy" class="panel"></div>
          <button id="qNext">السؤال التالي</button>
        </div>
      </div>
    </div>
  </section>

  <aside id="info">
    <div id="infoHead">
      <div id="infoName">لوحة المعلومات</div>
      <button id="infoClose" title="إغلاق">✕</button>
    </div>
    <div id="infoEmpty">
      اضغط على أي <b>عضية</b> أو جزء داخل الرسم، وتطلعلك هنا:
      الاسم، الموقع، التركيب، الوظيفة، وملاحظة مهمة للامتحان.
    </div>
    <div id="infoBody" hidden></div>
    <div id="infoFoot" hidden>
      <button id="seeFn">شوف الوظيفة</button>
    </div>
  </aside>
</main>

<div id="bar">
  <button id="playBtn">إيقاف ⏸</button>
  <div class="ctl">
    <label for="spd">سرعة الحركة</label>
    <input id="spd" type="range" min="0.2" max="2.5" step="0.1" value="1">
    <output id="spdOut">1.0×</output>

/* ══════════════════════════════════════════════════════════════════════════
   2 · أدوات رسم عامة (SVG)
   ══════════════════════════════════════════════════════════════════════════ */

const SVGNS = 'http://www.w3.org/2000/svg';

/* مولّد أرقام شبه عشوائية ثابت — حتى يبقى شكل الخلية نفسه بكل تشغيل */
function rng(seed){ let s = seed >>> 0;
  return function(){ s = (s + 0x6D2B79F5) >>> 0; let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const n2 = v => Math.round(v * 10) / 10;

/* مسار مغلق ناعم يمر بكل النقاط (Catmull-Rom → Bezier) */
function smoothClosed(pts){
  const n = pts.length; let d = `M${n2(pts[0][0])},${n2(pts[0][1])}`;
  for (let i = 0; i < n; i++){
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${n2(c1[0])},${n2(c1[1])} ${n2(c2[0])},${n2(c2[1])} ${n2(p2[0])},${n2(p2[1])}`;
  }
  return d + 'Z';
}
/* مسار مفتوح ناعم */
function smoothOpen(pts){
  if (pts.length < 3) return `M${pts.map(p => n2(p[0]) + ',' + n2(p[1])).join(' L')}`;
  let d = `M${n2(pts[0][0])},${n2(pts[0][1])}`;
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1],
          p3 = pts[Math.min(pts.length - 1, i + 2)];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${n2(c1[0])},${n2(c1[1])} ${n2(c2[0])},${n2(c2[1])} ${n2(p2[0])},${n2(p2[1])}`;
  }
  return d;
}

/* حدود خلية غير منتظمة الشكل (واقعية) */
function blobPath(cx, cy, rx, ry, wob, seed, steps){
  const r = rng(seed), pts = [], k = steps || 22;
  for (let i = 0; i < k; i++){
    const a = i / k * Math.PI * 2, w = 1 + (r() - 0.5) * 2 * wob;
    pts.push([cx + Math.cos(a) * rx * w, cy + Math.sin(a) * ry * w]);
  }
  return { d: smoothClosed(pts), pts };
}
/* مسار مصغّر من نفس الشكل (للأغشية المزدوجة والجدران) */
function insetBlob(pts, cx, cy, k){
  return smoothClosed(pts.map(p => [cx + (p[0] - cx) * k, cy + (p[1] - cy) * k]));
}

/* شريط متموّج للشبكة البلازمية الداخلية: يرجع المسار + مواقع الرايبوسومات + نقاط المسير */
function erRibbon(x0, y0, dx, dy, amp, cycles, steps){
  const pts = [], k = steps || 26, len = Math.hypot(dx, dy),
        ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
  for (let i = 0; i <= k; i++){
    const t = i / k, s = Math.sin(t * Math.PI * 2 * cycles) * amp * Math.sin(Math.PI * t * 0.9 + 0.3);
    pts.push([x0 + ux * len * t + nx * s, y0 + uy * len * t + ny * s]);
  }
  const dots = [];
  for (let i = 1; i < k; i += 2){
    const p = pts[i], q = pts[i + 1] || pts[i - 1];
    const tx = q[0] - p[0], ty = q[1] - p[1], tl = Math.hypot(tx, ty) || 1;
    const px = -ty / tl, py = tx / tl, off = 7.5;
    dots.push([p[0] + px * off, p[1] + py * off]);
    if (i % 4 === 1) dots.push([p[0] - px * off, p[1] - py * off]);
  }
  return { d: smoothOpen(pts), dots, pts };
}

function part(id, inner, extra){
  return `<g class="part" data-part="${id}"${extra ? ' ' + extra : ''}>${inner}</g>`;
}
function wrap(tr, inner){ return `<g transform="${tr}">${inner}</g>`; }

/* مايتوكوندريا: غشاء مزدوج + أعراف (كرستي) */
function mitoShape(w, h){
  const rx = w / 2, ry = h / 2, cr = [];
  for (let i = -3; i <= 3; i++){
    const x = i * (w * 0.13);
    const yy = ry * 0.82 * Math.sqrt(Math.max(0, 1 - (x / (rx * 0.94)) ** 2));
    cr.push(`M${n2(x)},${n2(-yy)} C${n2(x + 9)},${n2(-yy * .45)} ${n2(x - 9)},${n2(yy * .45)} ${n2(x)},${n2(yy)}`);
  }
  return `
    <ellipse rx="${n2(rx)}" ry="${n2(ry)}" fill="url(#gMito)" stroke="#f6c79c" stroke-width="2.2" filter="url(#fSoft)"/>
    <ellipse rx="${n2(rx - 5)}" ry="${n2(ry - 5)}" fill="none" stroke="#ffdcb8" stroke-width="1.3" opacity=".75"/>
    <g stroke="#ffd9ac" stroke-width="2" fill="none" opacity=".85" stroke-linecap="round">${cr.join('')}</g>
    <ellipse class="mitoGlow" rx="${n2(rx + 3)}" ry="${n2(ry + 3)}" fill="none"
             stroke="#ffcf8a" stroke-width="3" opacity="0"/>`;
}
/* جهاز كولجي / الدكتيوسوم: أكياس مسطحة متراكبة */
function golgiShape(){
  const s = [];
  for (let i = 0; i < 5; i++){
    const w = 108 - i * 13, y = i * 15;
    s.push(`<path d="M${-w / 2},${y} C${-w / 3},${y - 13} ${w / 3},${y - 13} ${w / 2},${y}
             C${w / 3},${y + 7} ${-w / 3},${y + 7} ${-w / 2},${y} Z"
             fill="url(#gGolgi)" stroke="#f7c0da" stroke-width="1.6"/>`);
  }
  return `<g filter="url(#fSoft)">${s.join('')}</g>
    <circle cx="-64" cy="14" r="7" fill="url(#gGolgi)" stroke="#f7c0da" stroke-width="1.2" opacity=".9"/>
    <circle cx="66" cy="42" r="6" fill="url(#gGolgi)" stroke="#f7c0da" stroke-width="1.2" opacity=".9"/>

/* النواة: غلاف نووي مزدوج بثقوب + نوية + شبكة كروماتينية */
function nucleusShape(r, seed, showParts){
  const rr = rng(seed || 11), pores = [], chrom = [];
  for (let i = 0; i < 16; i++){
    const a = i / 16 * 6.283 + 0.12;
    pores.push(`<g transform="translate(${n2(Math.cos(a) * r)},${n2(Math.sin(a) * r)}) rotate(${n2(a * 57.3)})">
      <rect x="-2.6" y="-4.6" width="5.2" height="9.2" rx="2.2" fill="#2a2140" stroke="#cbbcf6" stroke-width="1.1"/></g>`);
  }
  for (let i = 0; i < 9; i++){
    const pts = [];
    let a = rr() * 6.283, d = 12 + rr() * (r * 0.62);
    for (let j = 0; j < 5; j++){
      a += (rr() - 0.5) * 2.2; d = Math.min(r * 0.78, Math.max(8, d + (rr() - 0.5) * 34));
      pts.push([Math.cos(a) * d, Math.sin(a) * d]);
    }
    chrom.push(`<path d="${smoothOpen(pts)}" fill="none" stroke="#3a2d6b" stroke-width="${n2(1.6 + rr() * 1.5)}"
      opacity=".85" stroke-linecap="round"/>`);
  }
  const body = `
    <circle r="${r}" fill="url(#gNucl)" stroke="#cbbcf6" stroke-width="2" filter="url(#fSoft)"/>
    <circle r="${n2(r - 5)}" fill="none" stroke="#e2d8ff" stroke-width="1.2" opacity=".55"/>`;
  if (!showParts) return body + `<g>${chrom.join('')}</g><g>${pores.join('')}</g>
    <circle cx="${n2(-r * 0.22)}" cy="${n2(r * 0.16)}" r="${n2(r * 0.3)}" fill="url(#gNucleolus)" stroke="#b6a3ef" stroke-width="1.4"/>`;
  /* نسخة بأجزاء قابلة للضغط (مشهد النواة المكبّرة) */
  return body
    + part('chromatin', `<g>${chrom.join('')}</g><circle r="${n2(r - 8)}" fill="transparent"/>`)
    + part('pore', `<g>${pores.join('')}</g>`)
    + part('nucleolus', `<circle cx="${n2(-r * 0.22)}" cy="${n2(r * 0.16)}" r="${n2(r * 0.3)}"
        fill="url(#gNucleolus)" stroke="#b6a3ef" stroke-width="1.6"/>`);
}

/* ══════════════════════════════════════════════════════════════════════════
   3 · نظام الجزيئات المتحركة (مسارات داخل الخلية)
   ══════════════════════════════════════════════════════════════════════════ */

function prepPath(pts){
  const cum = [0];
  for (let i = 1; i < pts.length; i++)
    cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return { pts, cum, len: cum[cum.length - 1] };
}
function alongPath(p, d){
  const { pts, cum } = p;
  if (d <= 0) return pts[0];
  for (let i = 1; i < cum.length; i++){
    if (d <= cum[i]){
      const t = (d - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1);
      return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t,
              pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t];
    }
  }
  return pts[pts.length - 1];
}
/* تعريف تيار جزيئات: عدة مسارات، ولّادة دورية، شكل الجزيئة */
function flow(o){
  return {
    paths: o.paths.map(prepPath), speed: o.speed || 55, every: o.every || 1.3,
    max: o.max || 5, r: o.r || 3.2, fill: o.fill || '#ffffff', halo: o.halo !== false,
    tail: !!o.tail, ring: !!o.ring, owner: o.owner || null, acc: o.every ? o.every * 0.4 : 0.5,
    items: []
  };
}

    /* مسارات الحركة */

    const mrnaPaths = [
      [poreAt(0.35), [500, 350], rer1.dots[2]],
      [poreAt(0.9), [470, 400], rer2.dots[1]],
      [poreAt(-0.5), [520, 250], [560, 180]],
      [poreAt(1.9), [350, 400], [385, 540]]
    ];
    const proteinPaths = [
      rer1.pts.slice(4).concat([[GOLGI[0] - 10, GOLGI[1] - 14]]),
      rer2.pts.slice(3).concat([[GOLGI[0] - 20, GOLGI[1] + 6]])
    ];
    const exitA = 0.12, exitB = 0.55;
    const exitPt = a => [CX + Math.cos(a) * RX * 1.0, CY + Math.sin(a) * RY * 1.0];
    const outPt = a => [CX + Math.cos(a) * RX * 1.22, CY + Math.sin(a) * RY * 1.22];
    const vesPaths = [
      [[GOLGI[0] + 40, GOLGI[1] + 45], [700, 470], exitPt(exitA), outPt(exitA)],
      [[GOLGI[0] + 46, GOLGI[1] + 55], [700, 520], exitPt(exitB), outPt(exitB)]
    ];
    const atpPaths = [];
    MITO.forEach(([mx, my]) => {
      [[GOLGI[0], GOLGI[1]], NUC, [rer1.dots[4][0], rer1.dots[4][1]], [LYSO[0][0], LYSO[0][1]]]
        .forEach(t => atpPaths.push([[mx, my], [(mx + t[0]) / 2 + 18, (my + t[1]) / 2 - 16], t]));
    });

    return {
      body,
      stream: { cx: CX, cy: CY, rx: RX * 0.94, ry: RY * 0.94, count: 46 },
      flows: [
        flow({ paths: mrnaPaths, speed: 58, every: 0.85, max: 7, r: 3.4, fill: '#cbb6ff', tail: true }),
        flow({ paths: proteinPaths, speed: 42, every: 1.2, max: 5, r: 3.8, fill: '#ffe2ab', tail: true, owner: 'rer' }),
        flow({ paths: vesPaths, speed: 40, every: 2.2, max: 3, r: 8, fill: 'rgba(240,170,205,.5)', ring: true, owner: 'golgi' }),
        flow({ paths: atpPaths, speed: 66, every: 0.5, max: 12, r: 2.7, fill: '#ffe066', owner: 'mito' })
      ],
      parts: [
        { id: 'pm',        anchor: [694, 176], label: [858, 108], side: 'R' },
        { id: 'mito',      anchor: [680, 225], label: [858, 186], side: 'R' },
        { id: 'rer',       anchor: [600, 366], label: [858, 262], side: 'R' },
        { id: 'lyso',      anchor: [720, 320], label: [858, 330], side: 'R' },
        { id: 'golgi',     anchor: [640, 440], label: [858, 404], side: 'R' },
        { id: 'vesicle',   anchor: [694, 480], label: [858, 478], side: 'R' },
        { id: 'ribo',      anchor: [620, 570], label: [858, 548], side: 'R' },
        { id: 'nonliving', anchor: [716, 428], label: [858, 620], side: 'R' },
        { id: 'centro',    anchor: [575, 200], label: [142, 104], side: 'L' },
        { id: 'nuc',       anchor: [430, 250], label: [142, 176], side: 'L' },
        { id: 'nucleolus', anchor: [395, 300], label: [142, 250], side: 'L' },
        { id: 'ser',       anchor: [300, 268], label: [142, 330], side: 'L' },
        { id: 'cyto',      anchor: [330, 370], label: [142, 404], side: 'L' },
        { id: 'chromatin', anchor: [450, 320], label: [142, 476], side: 'L' }
      ],
      tools: [
        { id: 'membTest', label: 'اختبر نصف النفاذية', toggle: true },
        { id: 'protRoute', label: 'تتبّع مسار البروتين' },
        { id: 'tableAP', label: 'جدول: نباتية / حيوانية' }
      ],
      /* الحركات الخاصة: نبض المايتوكوندريا، هضم الجسيم الحال، عبور الغشاء */
      state: { lyso: { ph: 'wait', t: 0 }, memb: [] },
      init(api){
        this.state.lyso = { ph: 'wait', t: 0 };
        this.state.memb = [];
        api.g('lysoTrack', `<g id="lysoTrack" opacity="0">${lysoShape(15)}</g>`);
        api.g('membMol', '<g id="membMol"></g>');
        const d = api.el('#debris'); if (d){ d.style.opacity = 1; d.style.transform = 'none'; }
      },
      tick(dt, t, api){
        /* نبض المايتوكوندريا + توزيع الطاقة */
        const pulse = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 2.1));
        api.all('.mitoGlow').forEach((e, i) =>
          e.setAttribute('opacity', String(0.15 + pulse * 0.5 * (i % 2 ? 0.8 : 1))));

        /* الجسيم الحال: ينشأ من كولجي ← يتحرك للجسم الغريب ← يلتحم ← يهضمه */
        const S = this.state.lyso, trk = api.el('#lysoTrack'), deb = api.el('#debris');
        if (trk && deb){
          S.t += dt;
          const lerp = (a, b, k) => a + (b - a) * k;
          if (S.ph === 'wait'){
            trk.setAttribute('opacity', '0');
            deb.style.opacity = '1';
            deb.setAttribute('transform', `translate(${DEBRIS[0]},${DEBRIS[1]}) scale(1)`);
            if (S.t > 1.4){ S.ph = 'go'; S.t = 0; }
          } else if (S.ph === 'go'){
            const k = Math.min(1, S.t / 3.2);
            const x = lerp(GOLGI[0] - 10, DEBRIS[0] - 22, k), y = lerp(GOLGI[1] + 55, DEBRIS[1] - 6, k);
            trk.setAttribute('opacity', String(Math.min(1, k * 4)));
            trk.setAttribute('transform', `translate(${n2(x)},${n2(y)})`);
            if (k >= 1){ S.ph = 'fuse'; S.t = 0; }
          } else if (S.ph === 'fuse'){
            const k = Math.min(1, S.t / 1.1);
            trk.setAttribute('transform', `translate(${n2(lerp(DEBRIS[0] - 22, DEBRIS[0], k))},${n2(DEBRIS[1])}) scale(${n2(1 + k * 0.5)})`);
            trk.setAttribute('opacity', String(1 - k * 0.35));
            if (k >= 1){ S.ph = 'digest'; S.t = 0; }
          } else if (S.ph === 'digest'){
            const k = Math.min(1, S.t / 2.4);
            deb.setAttribute('transform', `translate(${DEBRIS[0]},${DEBRIS[1]}) scale(${n2(1 - k * 0.92)})`);
            deb.style.opacity = String(1 - k);
            trk.setAttribute('opacity', String(0.65 * (1 - k)));
            trk.setAttribute('transform', `translate(${DEBRIS[0]},${DEBRIS[1]}) scale(${n2(1.5 - k * 0.5)})`);
            if (k >= 1){ S.ph = 'wait'; S.t = 0; }
          }
        }

        /* نصف النفاذية: جزيئات صغيرة تعبر وكبيرة ترتد */
        if (api.tool('membTest')){
          const host = api.el('#membMol');
          if (host){
            const M = this.state.memb;
            if (M.length < 9 && Math.random() < dt * 2.6){
              const big = Math.random() < 0.42;
              const a = -0.9 + Math.random() * 2.6;
              const px = CX + Math.cos(a) * RX, py = CY + Math.sin(a) * RY;
              const el = document.createElementNS(SVGNS, 'g');
              el.innerHTML = big
                ? `<circle r="9.5" fill="rgba(212,72,60,.38)" stroke="#f0a49a" stroke-width="1.8"/>
                   <circle r="3" fill="#f0a49a" opacity=".8"/>`
                : `<circle r="4" fill="#9fe9d0" stroke="#e6fff6" stroke-width="1.2"/>`;
              host.appendChild(el);
              M.push({ el, big, a, d: 1.42, dir: -1, dead: 0 });
            }
            for (let i = M.length - 1; i >= 0; i--){
              const m = M[i];
              m.d += m.dir * dt * 0.22;
              if (m.dir < 0 && m.d <= 1.0){
                if (m.big){ m.dir = 1; m.bounced = 1; } else { m.d = 0.99; m.dir = -1; }
              }
              if (!m.big && m.d < 0.42) m.dead = 1;
              if (m.big && m.d > 1.6) m.dead = 1;
              const x = CX + Math.cos(m.a) * RX * m.d, y = CY + Math.sin(m.a) * RY * m.d;
              m.el.setAttribute('transform', `translate(${n2(x)},${n2(y)})`);
              m.el.setAttribute('opacity', String(m.dead ? 0 : (m.d < 0.6 ? m.d / 0.6 : 1)));
              if (m.dead){ m.el.remove(); M.splice(i, 1); }
            }
          }
        } else if (this.state.memb.length){
          this.state.memb.forEach(m => m.el.remove());
          this.state.memb = [];
        }
      }
    };
  }
};

/* ══════════════════════════════════════════════════════════════════════════
   5 · الانقسام الخلوي (محرك مشترك للخيطي والاختزالي)
   ══════════════════════════════════════════════════════════════════════════ */

const CLR = { a: '#e2574c', aT: '#f5a39c', b: '#4d8fd6', bT: '#a3c8f0' };
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;

/* شكل خلية مع إمكانية «الخصر» (الانقسام السايتوبلازمي) */
function cellShape(c){
  const steps = 40, pts = [];
  for (let i = 0; i < steps; i++){
    const a = i / steps * Math.PI * 2;
    const cs = Math.cos(a), sn = Math.sin(a);
    /* الخلية النباتية شبه مستطيلة بزوايا دائرية، والحيوانية بيضوية */
    let x = c.rect ? Math.sign(cs) * Math.pow(Math.abs(cs), 0.45) * c.rx : cs * c.rx;
    let y = c.rect ? Math.sign(sn) * Math.pow(Math.abs(sn), 0.45) * c.ry : sn * c.ry;
    if (c.waist > 0){
      if (c.axis === 'y'){ const f = Math.exp(-Math.pow(y / (c.ry * 0.34), 2)); x *= 1 - c.waist * f; }

    }
    pts.push([c.cx + x, c.cy + y]);
  }
  return smoothClosed(pts);

            S.spindleOp = ph === 'pro2' ? e * 0.7 : (ph === 'telo2' ? 0 : 0.8);
            S.cap = ph === 'telo2' ? 'أربع خلايا ناتجة، كل واحدة بنصف عدد الكروموسومات (n)'
                  : (ph === 'pro2' ? 'يبدأ الانقسام الثاني بلا تضاعف جديد للـ DNA' : 'انفصال الكروماتيدات في كل خلية');
          }
          S.phaseIdx = pi; S.u = u;
          return S;
        },

        apply(S, api, plant){
          const setA = (el, o) => { for (const k in o) el.setAttribute(k, String(o[k])); };
          api.all('.dcell').forEach((el, i) => {
            const c = S.cells[i];
            if (!c){ el.setAttribute('opacity', '0'); return; }
            setA(el, { d: cellShape(Object.assign({}, c, { rect: plant })), opacity: 1 });
            el.setAttribute('stroke-width', plant ? '11' : '5');
            el.setAttribute('stroke', plant ? 'url(#gWall)' : 'url(#gMemb)');
          });
          api.all('.denv').forEach((g, i) => {
            const e = S.envs[i];
            if (!e){ g.setAttribute('opacity', '0'); return; }
            g.setAttribute('opacity', String(Math.max(0, e.op)));
            setA(g.querySelector('.ec'), { cx: n2(e.cx), cy: n2(e.cy), r: n2(e.r) });
            setA(g.querySelector('.en'), { cx: n2(e.nx === undefined ? e.cx - 20 : e.nx), cy: n2(e.ny === undefined ? e.cy + 14 : e.ny), r: n2(e.nr || 18) });
          });
          const chn = api.el('#chromatinG');
          if (chn){
            const c = S.chromatin;
            chn.setAttribute('opacity', String(c ? c.op : 0));
            if (c) chn.setAttribute('transform', `translate(${n2(c.x)},${n2(c.y)})`);
          }
          api.all('.chd').forEach((g, i) => {
            const c = S.chr[i];
            if (!c){ g.setAttribute('opacity', '0'); return; }
            g.setAttribute('opacity', String(c.op));
            g.setAttribute('transform', `translate(${n2(c.x)},${n2(c.y)}) rotate(${n2(c.rot)}) scale(${n2(c.sc)})`);
            g.querySelector('.armM').setAttribute('fill', c.main);
            g.querySelector('.armT').setAttribute('fill', c.tip);
            g.querySelector('.armC').setAttribute('fill', c.main);
          });
          api.all('.dcen').forEach((g, i) => {
            const c = S.cent[i];
            if (!c || plant){ g.setAttribute('opacity', '0'); return; }
            g.setAttribute('opacity', String(c.op));
            g.setAttribute('transform', `translate(${n2(c.x)},${n2(c.y)}) scale(${c.s})`);
          });
          api.all('.dplate').forEach((el, i) => {
            const p = S.plates[i];
            if (!p || !plant){ el.setAttribute('opacity', '0'); return; }
            setA(el, { x: n2(p.x), y: n2(p.y), width: n2(p.w), height: n2(p.h), opacity: 1 });
          });
          const sp = api.el('#spindle');
          if (sp){
            const poles = S.poles2 || S.poles;
            let d = '';
            if (poles && S.spindleOp > 0.02){
              S.chr.forEach(c => {
                if (!c || c.op < 0.2) return;
                poles.forEach(p => {
                  if (S.poles2 && Math.abs(p[0] - c.x) > 170) return;
                  d += `M${n2(p[0])},${n2(p[1])} L${n2(c.x)},${n2(c.y)}`;
                });
              });
            }
            sp.setAttribute('d', d || 'M0,0');
            sp.setAttribute('opacity', String(Math.max(0, S.spindleOp || 0)));
          }
          const xo = api.el('#xover');
          if (xo){
            if (S.xo > 0.02 && api.tool('showX')){
              xo.innerHTML = [[465, 292], [537, 402]].map(([x, y]) =>
                `<g transform="translate(${x},${y})" opacity="${n2(S.xo)}">
                   <circle r="20" fill="none" stroke="#ffd166" stroke-width="2.4" stroke-dasharray="4 3"/>
                   <path d="M-11,-11 L11,11 M11,-11 L-11,11" stroke="#ffd166" stroke-width="2.6" stroke-linecap="round"/>
                   <text class="lbl sm" x="26" y="5" fill="#ffd166" text-anchor="end">تصالب</text>
                 </g>`).join('');
            } else xo.innerHTML = '';
          }
          api.setCap(S.cap || '');
          api.setPhase(PH[S.phaseIdx], this.state.T);
        },

        tick(dt, t, api){
          const plant = !isMei && api.tool('plant');
          if (api.playing && !api.dragSlider){
            this.state.T += dt * 0.055;
            if (this.state.T >= 1) this.state.T = 0;
            api.setSlider(this.state.T);
          } else if (api.sliderVal !== undefined && api.dragSlider){
            this.state.T = api.sliderVal;
          }
          this.apply(this.compute(this.state.T, plant), api, plant);
        },
        onSlider(v){ this.state.T = v; },
        onReset(){ this.state.T = 0; }
      };
    }
  };
}
SCENES.mitosis = divisionScene('mit');
SCENES.meiosis = divisionScene('mei');

/* ══════════════════════════════════════════════════════════════════════════
   6 · المحرك: التبويبات، الأسماء، لوحة المعلومات، الحركة، أدوات التحكم
   ══════════════════════════════════════════════════════════════════════════ */

const TABS = [
  { k: 'animal',   t: 'الخلية الحيوانية' },
  { k: 'plant',    t: 'الخلية النباتية' },
  { k: 'pro',      t: 'بدائية وحقيقية النواة' },
  { k: 'membrane', t: 'الغشاء البلازمي مكبّراً' },
  { k: 'nucleus',  t: 'النواة مكبّرة' },
  { k: 'mitosis',  t: 'الانقسام الخيطي' },
  { k: 'meiosis',  t: 'الانقسام الاختزالي' },
  { k: 'exam',     t: 'وضع الامتحان' }
];

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const svgHost = $('#svgHost'), fx = $('#fx'), stage = $('#stage');
const REDUCE = window.matchMedia('(prefers-reduced-motion:reduce)').matches;

let cur = null, curKey = null, playing = !REDUCE, speedMul = 1, tAcc = 0;
let focusOwner = null, focusUntil = 0, selPart = null;
const toolState = {}, radioState = {};
let flows = [], stream = null, streamParts = [];

const api = {
  playing: playing, sliderVal: 0, dragSlider: false,
  el: s => svgHost.querySelector(s),
  all: s => Array.from(svgHost.querySelectorAll(s)),
  g(id, markup){
    if (!svgHost.querySelector('#' + id)){
      const t = document.createElementNS(SVGNS, 'g');

      while (t.firstChild) svgHost.appendChild(t.firstChild);

  radio: g => radioState[g],

  setSlider(v){ api.sliderVal = v; const s = $('#pslider'); if (s && !api.dragSlider) s.value = String(v); },
  setCap(t){ const e = $('#phaseCap'); if (e) e.textContent = t; },
  setPhase(ph, T){

};

/* ───────────── طبقة الأسماء والتأشيرات ───────────── */
function wrapName(s, max){
  const w = s.split(' '), out = []; let line = '';
  w.forEach(x => {
    if ((line + ' ' + x).trim().length > max){ if (line) out.push(line); line = x; }
    else line = (line + ' ' + x).trim();
  });
  if (line) out.push(line);
  return out;
}
function nameOf(p){ return p.short || (INFO[p.id] ? INFO[p.id].name : p.id); }

function labelLayer(parts){
  const g = parts.map(p => {
    const nm = nameOf(p), lines = wrapName(nm, 15);
    const anch = p.side === 'R' ? 'end' : p.side === 'L' ? 'start' : 'middle';
    const tx = p.side === 'R' ? p.label[0] + 8 : p.side === 'L' ? p.label[0] - 8 : p.label[0];
    const y0 = p.label[1] - (lines.length - 1) * 8;
    const tsp = lines.map((l, i) => `<tspan x="${n2(tx)}" dy="${i ? 16 : 0}">${l}</tspan>`).join('');
    return `<g class="lblG" data-for="${p.id}">
      <line class="lead" x1="${n2(p.label[0])}" y1="${n2(p.label[1])}" x2="${n2(p.anchor[0])}" y2="${n2(p.anchor[1])}"/>
      <circle class="lblDot" cx="${n2(p.anchor[0])}" cy="${n2(p.anchor[1])}" r="3.4"/>
      <text class="lbl" x="${n2(tx)}" y="${n2(y0)}" text-anchor="${anch}">${tsp}</text>
    </g>`;
  }).join('');
  return `<g id="labelLayer">${g}</g>`;
}

/* ───────────── بناء المشهد ───────────── */
function loadScene(key){
  curKey = key;
  $$('.tab').forEach(b => b.classList.toggle('on', b.dataset.k === key));
  closeSheet(); clearInfo();
  const isExam = key === 'exam';
  $('#exam').classList.toggle('on', isExam);
  $('#info').style.display = isExam ? 'none' : '';
  $('#bar').style.display = isExam ? 'none' : '';
  $('#phaseBar').classList.remove('on');
  if (isExam){ cur = null; flows = []; stream = null; $('#sceneName').textContent = 'وضع الامتحان'; $('#sceneHint').textContent = ''; initExam(); return; }

  const def = SCENES[key];
  cur = def.build();
  cur.key = key;
  $('#sceneName').textContent = def.title;
  $('#sceneHint').textContent = def.hint;

  for (const k in toolState) delete toolState[k];
  (cur.tools || []).forEach(t => { if (t.toggle) toolState[t.id] = !!t.on; });

  svgHost.innerHTML = DEFS + cur.body + labelLayer(cur.parts || []) + '<g id="fxLayer"></g>';
  buildTools(cur.tools || []);
  bindParts();
  flows = cur.flows || [];
  flows.forEach(f => { f.items.forEach(i => i.el && i.el.remove()); f.items = []; f.off = false; });
  stream = cur.stream || null;
  initStream();
  if (cur.isDivision) $('#phaseBar').classList.add('on');
  if (cur.init) cur.init(api);
  applyLabelToggle();
}

function bindParts(){
  svgHost.querySelectorAll('.part').forEach(el => {
    el.addEventListener('click', ev => { ev.stopPropagation(); selectPart(el.dataset.part); });

/* ───────────── لوحة المعلومات ───────────── */
function selectPart(id){

});

/* ───────────── أدوات المشهد ───────────── */
function buildTools(tools){
  const host = $('#sceneTools');
  host.innerHTML = tools.map(t => {
    if (t.slider) return `<input id="pslider" class="stool" type="range" min="0" max="0.999" step="0.001" value="0"
      style="width:min(300px,52vw);padding:6px 10px;accent-color:var(--ember)" aria-label="أطوار الانقسام">`;
    return `<button class="stool" data-tool="${t.id}"${t.radio ? ` data-radio="${t.radio}"` : ''}${t.toggle ? ' data-toggle="1"' : ''}>${t.label}</button>`;
  }).join('');
  host.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => onTool(b.dataset.tool, b)));
  const sl = $('#pslider');
  if (sl){
    const st = () => { api.dragSlider = true; };
    const mv = () => { api.sliderVal = parseFloat(sl.value); if (cur && cur.onSlider) cur.onSlider(api.sliderVal); };
    const en = () => { api.dragSlider = false; };
    sl.addEventListener('pointerdown', st); sl.addEventListener('input', () => { st(); mv(); });
    sl.addEventListener('pointerup', en); sl.addEventListener('pointercancel', en);
    sl.addEventListener('change', () => { mv(); en(); });
  }
  syncTools();
}
function syncTools(){
  $$('#sceneTools [data-tool]').forEach(b => {
    const id = b.dataset.tool;
    if (b.dataset.radio) b.classList.toggle('on', radioState[b.dataset.radio] === id);
    else if (b.dataset.toggle) b.classList.toggle('on', !!toolState[id]);
  });
}
function onTool(id, btn){
  if (btn.dataset.radio){ radioState[btn.dataset.radio] = id; syncTools(); return; }
  if (btn.dataset.toggle){ toolState[id] = !toolState[id]; syncTools(); }
  if (id === 'tableAP') openSheet(TABLES.animalPlant);
  if (id === 'tablePE') openSheet(TABLES.proEu);
  if (id === 'tableMM') openSheet(TABLES.mitMei);
  if (id === 'compare'){
    if (toolState.compare){ highlightDiff(['wall', 'chloro', 'vacuole', 'nuc', 'nonliving']); openSheet(TABLES.animalPlant); }
    else { clearDiff(); closeSheet(); }
  }
  if (id === 'diff'){
    if (toolState.diff){ highlightDiff(cur.diffParts || []); openSheet(TABLES.proEu); }
    else { clearDiff(); closeSheet(); }
  }
  if (id === 'protRoute'){
    highlightDiff(['nuc', 'ribo', 'rer', 'golgi', 'vesicle', 'pm']);
    focusOwner = null; focusUntil = tAcc + 14;
    if (!playing) togglePlay(true);
    $('#sceneHint').textContent = 'مسار البروتين: النواة (رسالة RNA) ← الرايبوسوم ← الشبكة البلازمية الخشنة ← جهاز كولجي ← حويصلة إفرازية ← خارج الخلية عبر الغشاء البلازمي.';
    setTimeout(() => { clearDiff(); $('#sceneHint').textContent = SCENES[curKey].hint; }, 14000);
  }
}
function highlightDiff(ids){
  svgHost.classList.add('dim');
  svgHost.querySelectorAll('.part').forEach(e => e.classList.toggle('sel', ids.includes(e.dataset.part)));
}
function clearDiff(){
  if (selPart) return;
  svgHost.classList.remove('dim');
  svgHost.querySelectorAll('.part').forEach(e => e.classList.remove('sel'));
}

/* ───────────── جدول المقارنة ───────────── */
function openSheet(tb){
  $('#sheetTitle').textContent = tb.title;
  $('#sheetBody').innerHTML = `<table><thead><tr>${tb.head.map(h => `<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${tb.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  $('#sheet').classList.add('on');
}
function closeSheet(){ $('#sheet').classList.remove('on'); }
$('#sheetClose').addEventListener('click', closeSheet);

/* ───────────── تيارات الجزيئات ───────────── */
function updateFlows(dt){
  const host = svgHost.querySelector('#fxLayer'); if (!host) return;
  flows.forEach(f => {
    const blocked = f.off || (focusOwner && f.owner && f.owner !== focusOwner);
    if (!blocked){
      f.acc += dt;
      if (f.acc >= f.every && f.items.length < f.max){
        f.acc = 0;
        const p = f.paths[Math.floor(Math.random() * f.paths.length)];
        const el = document.createElementNS(SVGNS, 'g');
        el.setAttribute('class', 'fxp');
        el.innerHTML = (f.halo ? `<circle r="${n2(f.r * 2.3)}" fill="${f.fill}" opacity=".22"/>` : '')
          + `<circle r="${n2(f.r)}" fill="${f.fill}"${f.ring ? ' stroke="#ffd9ee" stroke-width="1.6" fill-opacity=".45"' : ''}/>`;
        host.appendChild(el);
        f.items.push({ p, d: 0, el });
      }
    }
    for (let i = f.items.length - 1; i >= 0; i--){
      const it = f.items[i];
      if (!blocked) it.d += f.speed * dt;
      const pos = alongPath(it.p, it.d);
      it.el.setAttribute('transform', `translate(${n2(pos[0])},${n2(pos[1])})`);
      const rest = it.p.len - it.d;
      it.el.setAttribute('opacity', String(rest < 26 ? Math.max(0, rest / 26) : (it.d < 12 ? it.d / 12 : 1)));
      if (it.d >= it.p.len){ it.el.remove(); f.items.splice(i, 1); }
    }
  });
}

/* ───────────── جريان السايتوبلازم (Canvas) ───────────── */
const ctx = fx.getContext('2d');
let dpr = Math.min(2, window.devicePixelRatio || 1);
function fitCanvas(){
  const r = stage.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio || 1);
  fx.width = Math.max(1, Math.round(r.width * dpr));
  fx.height = Math.max(1, Math.round(r.height * dpr));
}
function initStream(){
  streamParts = [];
  if (!stream) return;
  const rr = rng(101), fMin = stream.fMin === undefined ? 0.12 : stream.fMin,
        fMax = stream.fMax === undefined ? 0.94 : stream.fMax;
  for (let i = 0; i < stream.count; i++){
    streamParts.push({
      a: rr() * 6.283, f: fMin + rr() * (fMax - fMin),
      w: (0.06 + rr() * 0.1) * (rr() < 0.5 ? -1 : 1),
      ph: rr() * 6.283, sz: 1.4 + rr() * 2.6, al: 0.16 + rr() * 0.3
    });
  }
}
function drawStream(dt, t){
  const r = stage.getBoundingClientRect();
  if (fx.width !== Math.round(r.width * dpr)) fitCanvas();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, fx.width, fx.height);
  if (!stream || !streamParts.length) return;
  const s = Math.min(r.width / 1000, r.height / 700);
  ctx.setTransform(dpr * s, 0, 0, dpr * s, dpr * (r.width - 1000 * s) / 2, dpr * (r.height - 700 * s) / 2);
  streamParts.forEach(p => {
    p.a += p.w * dt;
    const f = p.f + Math.sin(t * 0.7 + p.ph) * 0.03;
    const x = stream.cx + Math.cos(p.a) * stream.rx * f;
    const y = stream.cy + Math.sin(p.a) * stream.ry * f;
    const g = ctx.createRadialGradient(x, y, 0, x, y, p.sz * 3);
    g.addColorStop(0, `rgba(190,240,220,${p.al})`);
    g.addColorStop(1, 'rgba(190,240,220,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, p.sz * 3, 0, 6.283); ctx.fill();
  });
}

/* ───────────── الحلقة الرئيسية ───────────── */
let last = performance.now();
function frame(now){
  let dt = (now - last) / 1000; last = now;
  dt = Math.min(dt, 0.05);
  const slow = (focusOwner || tAcc < focusUntil) ? 0.45 : 1;
  if (tAcc >= focusUntil && focusOwner){ focusOwner = null; clearDiff(); }
  const eff = playing ? dt * speedMul * slow : 0;
  tAcc += eff;
  api.playing = playing;
  if (cur){
    updateFlows(eff);
    drawStream(eff, tAcc);
    if (cur.tick) cur.tick(eff, tAcc, api);
  }
  requestAnimationFrame(frame);
}

/* ───────────── أدوات التحكم العامة ───────────── */
function togglePlay(v){
  playing = v === undefined ? !playing : v;
  $('#playBtn').textContent = playing ? 'إيقاف ⏸' : 'تشغيل ▶';
}
$('#playBtn').addEventListener('click', () => togglePlay());
$('#spd').addEventListener('input', e => {
  speedMul = parseFloat(e.target.value);
  $('#spdOut').textContent = speedMul.toFixed(1) + '×';
});
function applyLabelToggle(){
  const on = $('#lblTgl').checked;
  const l = svgHost.querySelector('#labelLayer');
  if (l) l.classList.toggle('off', !on);
}
$('#lblTgl').addEventListener('change', applyLabelToggle);
$('#glowTgl').addEventListener('change', e => svgHost.classList.toggle('flat', !e.target.checked));
$('#resetBtn').addEventListener('click', () => {
  if (curKey === 'exam') initExam();
  else { if (cur && cur.onReset) cur.onReset(); loadScene(curKey); }
});
window.addEventListener('resize', fitCanvas);

/* ══════════════════════════════════════════════════════════════════════════
   7 · وضع الامتحان: «أشّر الأجزاء» + «اختبر نفسك»
   ══════════════════════════════════════════════════════════════════════════ */

const EXAM_DIAGRAMS = [
  { k: 'animal',   t: 'الخلية الحيوانية' },
  { k: 'plant',    t: 'الخلية النباتية' },
  { k: 'pro',      t: 'بدائية وحقيقية النواة' },
  { k: 'membrane', t: 'الغشاء البلازمي' },
  { k: 'nucleus',  t: 'النواة' }
];
const dragHost = $('#dragSvgHost');
let exMode = 'label', exDiag = 'animal';
let exParts = [], exDone = 0, exWrong = 0;

function shuffle(a){
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}

function initExam(){
  $('#pickRow').innerHTML = '<span>اختر الرسم:</span>' + EXAM_DIAGRAMS.map(d =>
    `<button class="stool" data-dg="${d.k}">${d.t}</button>`).join('')
    + '<button class="stool" id="reDraw">إعادة المحاولة</button>';
  $('#pickRow').querySelectorAll('[data-dg]').forEach(b =>
    b.addEventListener('click', () => loadDiagram(b.dataset.dg)));
  $('#reDraw').addEventListener('click', () => loadDiagram(exDiag));
  setExMode(exMode);
  loadDiagram(exDiag);
  buildQuiz();
}
function setExMode(m){
  exMode = m;
  $('#mLabel').classList.toggle('on', m === 'label');
  $('#mQuiz').classList.toggle('on', m === 'quiz');
  $('#dragWrap').style.display = m === 'label' ? 'flex' : 'none';
  $('#quiz').classList.toggle('on', m === 'quiz');
  updateScore();
}
$('#mLabel').addEventListener('click', () => setExMode('label'));
$('#mQuiz').addEventListener('click', () => setExMode('quiz'));

function updateScore(){
  $('#score').innerHTML = exMode === 'label'
    ? `صحيح <b>${exDone}</b> / ${exParts.length} &nbsp;·&nbsp; أخطاء <b>${exWrong}</b>`
    : `الدرجة <b>${qScore}</b> / ${qList.length} &nbsp;·&nbsp; سؤال ${Math.min(qIdx + 1, qList.length)}`;
}

/* ── أشّر الأجزاء ── */
function loadDiagram(k){
  exDiag = k; exDone = 0; exWrong = 0;
  $('#pickRow').querySelectorAll('[data-dg]').forEach(b => b.classList.toggle('on', b.dataset.dg === k));
  $('#dragDone').classList.remove('on');

  const s = SCENES[k].build();
  exParts = (s.parts || []).filter(p => INFO[p.id]);
  const slots = exParts.map((p, i) => {
    /* عرض ثابت يتّسع داخل هامش الرسم، والاسم يُلفّ على سطرين عند الحاجة */
    const w = p.side === 'C' ? 190 : 126, h = 34;
    const x = p.side === 'R' ? p.label[0] + 8 : p.side === 'L' ? p.label[0] - 8 - w : p.label[0] - w / 2;
    const y = p.label[1] - h / 2 - 4;
    return `<g class="slotG" data-id="${p.id}" data-i="${i}">
      <line class="lead" x1="${n2(p.label[0])}" y1="${n2(p.label[1])}" x2="${n2(p.anchor[0])}" y2="${n2(p.anchor[1])}"/>
      <circle class="lblDot" cx="${n2(p.anchor[0])}" cy="${n2(p.anchor[1])}" r="3.4"/>
      <rect class="slot" x="${n2(x)}" y="${n2(y)}" width="${n2(w)}" height="${h}" rx="6"/>
      <text class="slotTxt" x="${n2(x + w / 2)}" y="${n2(y + h / 2 + 4)}" text-anchor="middle"></text>
    </g>`;
  }).join('');
  dragHost.innerHTML = DEFS + s.body + `<g id="slotLayer">${slots}</g>`;

  $('#tray').innerHTML = shuffle(exParts).map(p =>
    `<button class="chip" data-id="${p.id}">${nameOf(p)}</button>`).join('');
  $('#tray').querySelectorAll('.chip').forEach(c => c.addEventListener('pointerdown', chipDown));
  updateScore();
}

let dragEl = null, dragSrc = null, dragId = null;
function chipDown(ev){
  const src = ev.currentTarget;
  if (src.classList.contains('done')) return;
  ev.preventDefault();
  dragSrc = src; dragId = src.dataset.id;
  dragEl = src.cloneNode(true);
  dragEl.classList.add('drag');
  document.body.appendChild(dragEl);
  moveDrag(ev);
  window.addEventListener('pointermove', moveDrag);
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
}
function moveDrag(ev){
  if (!dragEl) return;
  dragEl.style.left = (ev.clientX - dragEl.offsetWidth / 2) + 'px';
  dragEl.style.top = (ev.clientY - dragEl.offsetHeight / 2) + 'px';
  const hit = slotAt(ev.clientX, ev.clientY);
  dragHost.querySelectorAll('.slot').forEach(s => s.classList.remove('hot'));
  if (hit && !hit.classList.contains('done')) hit.querySelector('.slot').classList.add('hot');
}
function slotAt(x, y){
  let best = null, bd = 1e9;
  dragHost.querySelectorAll('.slotG').forEach(g => {
    const r = g.querySelector('.slot').getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const inside = x > r.left - 22 && x < r.right + 22 && y > r.top - 22 && y < r.bottom + 22;
    const d = Math.hypot(x - cx, y - cy);
    if (inside && d < bd){ bd = d; best = g; }
  });
  return best;
}
function endDrag(ev){
  window.removeEventListener('pointermove', moveDrag);
  window.removeEventListener('pointerup', endDrag);
  window.removeEventListener('pointercancel', endDrag);
  dragHost.querySelectorAll('.slot').forEach(s => s.classList.remove('hot'));
  const hit = slotAt(ev.clientX, ev.clientY);
  if (dragEl){ dragEl.remove(); dragEl = null; }
  if (!hit || hit.classList.contains('done')){ wrongShake(); return; }
  if (hit.dataset.id === dragId){
    hit.classList.add('done');
    hit.querySelector('.slot').classList.add('done');
    fillSlotText(hit.querySelector('.slotTxt'), dragSrc.textContent);
    dragSrc.classList.add('done');
    exDone++;
    if (exDone === exParts.length){
      const pct = Math.round(exDone / (exDone + exWrong) * 100);
      $('#dragDone').innerHTML = `أحسنت — أكملت تأشير الرسم. صحيح ${exDone} من ${exParts.length}، والأخطاء ${exWrong}. دقتك ${pct}%.`;
      $('#dragDone').classList.add('on');
    }
  } else {
    exWrong++;
    wrongShake();
  }
  updateScore();
}
function fillSlotText(el, name){
  const lines = wrapName(name, 19), x = el.getAttribute('x');
  const y0 = parseFloat(el.getAttribute('y')) - (lines.length - 1) * 5.5;
  el.innerHTML = lines.map((l, i) => `<tspan x="${x}" dy="${i ? 11 : 0}">${l}</tspan>`).join('');
  el.setAttribute('y', String(y0));
}
function wrongShake(){
  if (!dragSrc) return;
  dragSrc.classList.add('wrong');
  setTimeout(() => dragSrc && dragSrc.classList.remove('wrong'), 340);
}

/* ── اختبر نفسك ── */
let qList = [], qIdx = 0, qScore = 0;
function buildQuiz(){
  qList = shuffle(QUIZ); qIdx = 0; qScore = 0;
  renderQ();
}
function renderQ(){
  if (qIdx >= qList.length){
    $('#qMeta').textContent = 'انتهى الاختبار';
    $('#qText').textContent = `درجتك النهائية: ${qScore} من ${qList.length}.`;
    $('#qOpts').innerHTML = '<button class="opt" id="qAgain">أعد الاختبار بأسئلة مخلوطة</button>';
    $('#qAgain').addEventListener('click', buildQuiz);
    $('#qWhy').classList.remove('on');
    $('#qNext').classList.remove('on');
    updateScore();
    return;
  }
  const q = qList[qIdx];
  $('#qMeta').textContent = `سؤال ${qIdx + 1} من ${qList.length}`;
  $('#qText').textContent = q.q;
  $('#qOpts').innerHTML = q.o.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join('');
  $('#qOpts').querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => answer(parseInt(b.dataset.i, 10))));
  $('#qWhy').classList.remove('on');
  $('#qNext').classList.remove('on');
  updateScore();
}
function answer(i){
  const q = qList[qIdx];
  $$('#qOpts .opt').forEach((b, j) => {
    b.disabled = true;
    if (j === q.c) b.classList.add('good');
    else if (j === i) b.classList.add('bad');
  });
  if (i === q.c) qScore++;
  $('#qWhy').innerHTML = `<b>${i === q.c ? 'إجابة صحيحة.' : 'الإجابة الصحيحة: ' + q.o[q.c] + '.'}</b><br>${q.why}`;
  $('#qWhy').classList.add('on');
  $('#qNext').classList.add('on');
  updateScore();
}
$('#qNext').addEventListener('click', () => { qIdx++; renderQ(); });

/* ══════════════════════════════════════════════════════════════════════════
   8 · التشغيل
   ══════════════════════════════════════════════════════════════════════════ */
$('#tabs').innerHTML = TABS.map((t, i) =>
  `<button class="tab${i === 0 ? ' on' : ''}" data-k="${t.k}">${t.t}</button>`).join('');
$$('.tab').forEach(b => b.addEventListener('click', () => loadScene(b.dataset.k)));

fitCanvas();
togglePlay(!REDUCE);
loadScene('animal');
requestAnimationFrame(frame);
</script>

  قائمة TODO — ما يحتاج مطابقة مع الملزمة
════════════════════════════════════════════════════════════════════════════
  الملزمة (PDF أو صور الفصل الأول) لم تكن موجودة في الفولدر وقت بناء هذا
  الملف، فبُنيت كل المشاهد والنصوص بمصطلحات المنهج العراقي للسادس الإعدادي
  كما وردت في طلب العمل («الشبكة البلازمية الداخلية»، «الجسيمات الحالة»،
  «النوية»، «الشبكة الكروماتينية»، «الغلاف النووي»، «البلازم النووي»،
  «السايتوبلازم»). عند رفع الملزمة يجب مطابقة النقاط الآتية:

  1) جرد رسومات الملزمة: رقم الصفحة + اسم الرسم + الأجزاء المؤشرة على كل
     رسم. أي رسم في الملزمة غير مغطى بالمشاهد الحالية يُضاف كمشهد جديد،
     وأي مشهد هنا بلا رسم في الملزمة يُحذف.
  2) الصياغة الحرفية للتعاريف والوظائف والتراكيب في لوحة المعلومات
     (كائن INFO) — الآن مكتوبة بصياغة المنهج لا منقولة حرفياً من الملزمة.
  3) ترتيب الأجزاء المؤشرة ومواضع الأسماء على كل رسم (حقل parts في كل
     مشهد) ليطابق تأشيرات الملزمة نفسها.
  4) جداول المقارنة (TABLES): عدد الصفوف ووجوه المقارنة كما وردت في
     الملزمة بالضبط.
  5) الأسئلة: أسئلة «اختبر نفسك» (كائن QUIZ) الآن مصوغة من محتوى المنهج.
     تُستبدل بالأسئلة الوزارية وأسئلة الملزمة إن وُجدت، بنصّها.
  6) تفاصيل لم تُؤكَّد من الملزمة (مؤشَّرة داخل INFO بعبارة «راجع الملزمة»):
     • المحفظة والبلازميد والسوط في رسم الخلية البكتيرية: هل هي مؤشَّرة؟
       وكم عدد الأسواط وموقعها؟
     • الكولسترول في تركيب الغشاء البلازمي: هل ذُكر؟
     • الأهداب/الزوائد (pili) للبكتريا: غير مرسومة حالياً.
  7) الانقسام الخيطي والاختزالي: مبنيان على أساس 2n = 4 كروموسومات لتوضيح
     الحركة. يُطابق العدد ومسميات الأطوار ووصفها مع الملزمة، ويُتحقق هل
     الانقسام أصلاً داخل الفصل الأول أم فصل منفصل — إن لم يكن في الفصل
     الأول، يُحذف التبويبان.
  8) أجزاء لم تُرسم لعدم تأكيد وجودها في رسومات الملزمة: الأنيبيبات
     الدقيقة والخيوط الدقيقة (الهيكل الخلوي)، الأهداب والأسواط في الخلية
     الحيوانية، الفجوات المنقبضة، البلاستيدات الملونة وغير الملونة،
     النقاط الأولية (القنوات السايتوبلازمية) في الجدار الخلوي النباتي.
  9) المحتويات غير الحية: التصنيف الرباعي المستخدم (غذائية مخزونة /
     إفرازية / إطراحية / صبغات) يُطابق مع تصنيف الملزمة وأمثلتها.
